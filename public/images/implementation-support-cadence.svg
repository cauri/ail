<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs></defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Implementation Support Cadence</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#666">12-Month Engagement Rhythm</text>

  <!-- Timeline axis -->
  <rect x="140" y="65" width="810" height="25" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Month labels -->
  <text x="175" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M1</text>
  <text x="240" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M2</text>
  <text x="310" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M3</text>
  <text x="378" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M4</text>
  <text x="445" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M5</text>
  <text x="513" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M6</text>
  <text x="580" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M7</text>
  <text x="648" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M8</text>
  <text x="715" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M9</text>
  <text x="783" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M10</text>
  <text x="850" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M11</text>
  <text x="918" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">M12</text>

  <!-- Vertical grid lines -->
  <line x1="207" y1="90" x2="207" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="275" y1="90" x2="275" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="343" y1="90" x2="343" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="411" y1="90" x2="411" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="479" y1="90" x2="479" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="546" y1="90" x2="546" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="614" y1="90" x2="614" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="682" y1="90" x2="682" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="749" y1="90" x2="749" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="817" y1="90" x2="817" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="884" y1="90" x2="884" y2="490" stroke="#f1f5f9" stroke-width="1"/>

  <!-- ROW 1: Monthly Check-Ins -->
  <rect x="15" y="100" width="120" height="70" rx="6" fill="#2563eb"/>
  <text x="75" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Monthly</text>
  <text x="75" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Check-Ins</text>
  <text x="75" y="160" text-anchor="middle" font-size="7" fill="#93c5fd">Coaching conversations</text>

  <rect x="140" y="100" width="810" height="70" rx="0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <!-- Monthly circles -->
  <circle cx="175" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="240" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="310" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="378" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="445" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="513" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="580" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="648" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="715" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="783" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="850" cy="128" r="10" fill="#3b82f6"/>
  <circle cx="918" cy="128" r="10" fill="#3b82f6"/>
  <!-- Callout on M3 circle -->
  <rect x="215" y="145" width="195" height="20" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="312" y="159" text-anchor="middle" font-size="7" fill="#1e40af">Agenda: progress, indicators, blockers, cross-team</text>

  <!-- ROW 2: Quarterly Investment Retrospectives -->
  <rect x="15" y="180" width="120" height="70" rx="6" fill="#d97706"/>
  <text x="75" y="207" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Quarterly</text>
  <text x="75" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Retrospectives</text>
  <text x="75" y="237" text-anchor="middle" font-size="7" fill="#fef3c7">Investment effectiveness</text>

  <rect x="140" y="180" width="810" height="70" rx="0" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <!-- Quarterly diamonds at M3, M6, M9, M12 -->
  <rect x="301" y="199" width="18" height="18" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" transform="rotate(45 310 208)"/>
  <rect x="504" y="199" width="18" height="18" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" transform="rotate(45 513 208)"/>
  <rect x="706" y="199" width="18" height="18" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" transform="rotate(45 715 208)"/>
  <rect x="909" y="199" width="18" height="18" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" transform="rotate(45 918 208)"/>
  <!-- Labels under diamonds -->
  <text x="310" y="232" text-anchor="middle" font-size="7" fill="#92400e">Q1 Review</text>
  <text x="513" y="232" text-anchor="middle" font-size="7" fill="#92400e">Q2 Review</text>
  <text x="715" y="232" text-anchor="middle" font-size="7" fill="#92400e">Q3 Review</text>
  <text x="918" y="232" text-anchor="middle" font-size="7" fill="#92400e">Q4 Review</text>
  <!-- Callout on M6 -->
  <rect x="530" y="195" width="135" height="28" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.5"/>
  <text x="597" y="207" text-anchor="middle" font-size="7" fill="#854d0e">Are investments producing</text>
  <text x="597" y="217" text-anchor="middle" font-size="7" fill="#854d0e">results? → Retro Report</text>

  <!-- ROW 3: Re-Diagnostics -->
  <rect x="15" y="260" width="120" height="70" rx="6" fill="#dc2626"/>
  <text x="75" y="290" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Re-Diagnostics</text>
  <text x="75" y="305" text-anchor="middle" font-size="7" fill="#fca5a5">vs. baseline</text>
  <text x="75" y="320" text-anchor="middle" font-size="7" fill="#fca5a5">Every 3-6 months</text>

  <rect x="140" y="260" width="810" height="70" rx="0" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <!-- Star markers at ~M4 and ~M10 -->
  <polygon points="378,285 383,298 397,298 386,306 390,320 378,312 366,320 370,306 359,298 373,298" fill="#dc2626"/>
  <polygon points="783,285 788,298 802,298 791,306 795,320 783,312 771,320 775,306 764,298 778,298" fill="#dc2626"/>
  <text x="378" y="278" text-anchor="middle" font-size="8" font-weight="bold" fill="#991b1b">Re-Diagnostic 1</text>
  <text x="783" y="278" text-anchor="middle" font-size="8" font-weight="bold" fill="#991b1b">Re-Diagnostic 2</text>
  <!-- Callout -->
  <rect x="420" y="290" width="160" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="500" y="304" text-anchor="middle" font-size="7" fill="#991b1b">Calibration, not a test. Same instrument.</text>

  <!-- ROW 4: Roadmap Refreshes -->
  <rect x="15" y="340" width="120" height="70" rx="6" fill="#7c3aed"/>
  <text x="75" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Roadmap</text>
  <text x="75" y="385" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Refreshes</text>
  <text x="75" y="400" text-anchor="middle" font-size="7" fill="#c4b5fd">After each re-diagnostic</text>

  <rect x="140" y="340" width="810" height="70" rx="0" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <!-- Dependency arrows from re-diagnostics down to roadmap refreshes (line + triangle) -->
  <line x1="378" y1="322" x2="378" y2="352" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="378,358 373,348 383,348" fill="#7c3aed"/>
  <line x1="783" y1="322" x2="783" y2="352" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="783,358 778,348 788,348" fill="#7c3aed"/>
  <!-- Refresh boxes -->
  <rect x="340" y="358" width="76" height="28" rx="4" fill="#8b5cf6"/>
  <text x="378" y="376" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">Refresh 1</text>
  <rect x="745" y="358" width="76" height="28" rx="4" fill="#8b5cf6"/>
  <text x="783" y="376" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">Refresh 2</text>
  <!-- Callout -->
  <rect x="430" y="355" width="220" height="34" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="540" y="368" text-anchor="middle" font-size="7" fill="#5b21b6">Update roadmap based on evidence. Advance</text>
  <text x="540" y="380" text-anchor="middle" font-size="7" fill="#5b21b6">milestones complete. Extend where stalled.</text>

  <!-- Decision diamond after M12 -->
  <rect x="960" y="230" width="105" height="190" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1012" y="250" text-anchor="middle" font-size="9" font-weight="bold" fill="#5b21b6">Month 12+</text>

  <!-- Decision diamond -->
  <rect x="1000" y="265" width="24" height="24" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" transform="rotate(45 1012 277)"/>

  <!-- Three exit paths -->
  <text x="1012" y="310" text-anchor="middle" font-size="8" font-weight="bold" fill="#16a34a">Continue</text>
  <text x="1012" y="322" text-anchor="middle" font-size="7" fill="#475569">→ New cycle</text>

  <text x="1012" y="345" text-anchor="middle" font-size="8" font-weight="bold" fill="#d97706">Recalibrate</text>
  <text x="1012" y="357" text-anchor="middle" font-size="7" fill="#475569">→ New target</text>

  <text x="1012" y="380" text-anchor="middle" font-size="8" font-weight="bold" fill="#64748b">Disengage</text>
  <text x="1012" y="392" text-anchor="middle" font-size="7" fill="#475569">→ Team competent,</text>
  <text x="1012" y="404" text-anchor="middle" font-size="7" fill="#475569">self-sustaining</text>

  <!-- Bottom annotation -->
  <rect x="30" y="430" width="930" height="36" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="495" y="448" text-anchor="middle" font-size="10" fill="#854d0e" font-weight="600">Each activity type has a different purpose and conversation structure.</text>
  <text x="495" y="461" text-anchor="middle" font-size="9" fill="#92400e">Do not let check-ins drift into retrospective territory or retrospectives drift into re-diagnostic territory.</text>

  <!-- Legend -->
  <rect x="30" y="480" width="930" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="505" font-size="9" font-weight="bold" fill="#334155">Legend:</text>
  <circle cx="120" cy="500" r="7" fill="#3b82f6"/>
  <text x="135" y="504" font-size="8" fill="#475569">Monthly check-in</text>
  <rect x="222" y="492" width="14" height="14" rx="2" fill="#f59e0b" stroke="#d97706" stroke-width="1" transform="rotate(45 229 499)"/>
  <text x="250" y="504" font-size="8" fill="#475569">Quarterly retrospective</text>
  <polygon points="395,493 398,500 405,500 400,504 402,511 395,507 388,511 390,504 385,500 392,500" fill="#dc2626"/>
  <text x="413" y="504" font-size="8" fill="#475569">Re-diagnostic</text>
  <rect x="510" y="494" width="30" height="12" rx="3" fill="#8b5cf6"/>
  <text x="548" y="504" font-size="8" fill="#475569">Roadmap refresh</text>
  <line x1="648" y1="491" x2="648" y2="505" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="648,510 643,502 653,502" fill="#7c3aed"/>
  <text x="662" y="504" font-size="8" fill="#475569">Dependency</text>
  <rect x="752" y="492" width="20" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="780" y="504" font-size="8" fill="#475569">Decision point</text>

  <!-- NOT a status meeting callout -->
  <rect x="30" y="530" width="930" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="495" y="546" text-anchor="middle" font-size="9" fill="#1e40af" font-style="italic">Monthly check-ins are coaching conversations, NOT status meetings. Focus: "What support do you need?" not "What have you done?"</text>
</svg>