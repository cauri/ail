<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740"
     font-family="'Inter', sans-serif">
  <title>Non-Linear Progress Patterns</title>
  <desc>A chart showing expected versus actual competency development over 12 months. The expected line is a smooth diagonal. The actual line shows realistic patterns: an initial rise, a plateau from months 2-5 where practices are adopted but not yet habitual, a sharp jump from months 5-6 as investments mature, continued rise, a modest regression around month 9 under pressure, and recovery to a higher stable level. A leading indicators line moves ahead of the diagnostic score line.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="740" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="36" y="36" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Non-Linear Progress Patterns</text>
  <text x="36" y="54" font-size="12" fill="#6B7280">What competency development actually looks like over time</text>

  <!-- Chart area: x=90..740, y=80..400 -->

  <!-- Y-axis -->
  <line x1="90" y1="80" x2="90" y2="400" stroke="#E5E7EB" stroke-width="1"/>
  <text x="44" y="240" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90 44 240)">Competency Score</text>
  <line x1="85" y1="100" x2="90" y2="100" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="104" text-anchor="end" font-size="9" fill="#9CA3AF">High</text>
  <line x1="85" y1="240" x2="90" y2="240" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="244" text-anchor="end" font-size="9" fill="#9CA3AF">Mid</text>
  <line x1="85" y1="380" x2="90" y2="380" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="384" text-anchor="end" font-size="9" fill="#9CA3AF">Low</text>

  <!-- X-axis -->
  <line x1="90" y1="400" x2="740" y2="400" stroke="#E5E7EB" stroke-width="1"/>
  <text x="415" y="430" text-anchor="middle" font-size="10" fill="#6B7280">Months</text>
  <!-- Ticks: 0=90, 3=252.5, 6=415, 9=577.5, 12=740 -->
  <line x1="90" y1="400" x2="90" y2="406" stroke="#E5E7EB" stroke-width="1"/>
  <text x="90" y="418" text-anchor="middle" font-size="9" fill="#9CA3AF">0</text>
  <line x1="252" y1="400" x2="252" y2="406" stroke="#E5E7EB" stroke-width="1"/>
  <text x="252" y="418" text-anchor="middle" font-size="9" fill="#9CA3AF">3</text>
  <line x1="415" y1="400" x2="415" y2="406" stroke="#E5E7EB" stroke-width="1"/>
  <text x="415" y="418" text-anchor="middle" font-size="9" fill="#9CA3AF">6</text>
  <line x1="577" y1="400" x2="577" y2="406" stroke="#E5E7EB" stroke-width="1"/>
  <text x="577" y="418" text-anchor="middle" font-size="9" fill="#9CA3AF">9</text>
  <line x1="740" y1="400" x2="740" y2="406" stroke="#E5E7EB" stroke-width="1"/>
  <text x="740" y="418" text-anchor="middle" font-size="9" fill="#9CA3AF">12</text>

  <!-- Grid lines -->
  <line x1="90" y1="160" x2="740" y2="160" stroke="#F9FAFB" stroke-width="1"/>
  <line x1="90" y1="240" x2="740" y2="240" stroke="#F9FAFB" stroke-width="1"/>
  <line x1="90" y1="320" x2="740" y2="320" stroke="#F9FAFB" stroke-width="1"/>
  <line x1="252" y1="80" x2="252" y2="400" stroke="#F9FAFB" stroke-width="1"/>
  <line x1="415" y1="80" x2="415" y2="400" stroke="#F9FAFB" stroke-width="1"/>
  <line x1="577" y1="80" x2="577" y2="400" stroke="#F9FAFB" stroke-width="1"/>

  <!-- Line 1: "What clients expect" (thin gray dashed) -->
  <line x1="90" y1="375" x2="720" y2="115" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="724" y="108" font-size="9" fill="#9CA3AF">Expected: steady,</text>
  <text x="724" y="120" font-size="9" fill="#9CA3AF">linear improvement</text>

  <!-- Line 2: "What actually happens" (thick solid, accent color) -->
  <!-- mo0=90 mo1=144 mo2=198 mo3=252 mo4=306 mo5=361 mo6=415 mo7=469 mo8=523 mo9=577 mo10=631 mo11=685 mo12=740 -->
  <polyline
    points="90,370 144,342 198,310 228,306 252,304 280,303 306,304 333,304 361,301 385,278 400,240 415,195 442,178 469,165 496,158 523,152 550,150 563,153 577,162 592,172 610,166 631,155 660,148 685,143 710,140 730,138"
    fill="none" stroke="#D912AE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Line 3: Leading indicators (dotted, blue-400) -->
  <polyline
    points="90,365 144,338 198,300 228,290 252,278 280,270 306,262 333,258 361,250 385,242 400,228 415,192 442,180 469,172 496,166 523,162 550,160 563,164 577,172 592,168 610,156 631,146 660,140 685,136 710,133 730,131"
    fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- PLATEAU bracket and label -->
  <line x1="198" y1="315" x2="198" y2="326" stroke="#6B7280" stroke-width="1"/>
  <line x1="198" y1="326" x2="361" y2="326" stroke="#6B7280" stroke-width="1"/>
  <line x1="361" y1="315" x2="361" y2="326" stroke="#6B7280" stroke-width="1"/>
  <rect x="210" y="334" width="140" height="38" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1"/>
  <text x="280" y="350" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#92400E">PLATEAU</text>
  <text x="280" y="364" text-anchor="middle" font-size="8" fill="#92400E">Practices adopted, not yet habitual</text>

  <!-- JUMP label -->
  <rect x="385" y="206" width="85" height="32" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
  <text x="427" y="222" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#065F46">JUMP</text>
  <text x="427" y="234" text-anchor="middle" font-size="8" fill="#065F46">Compound effect</text>

  <!-- REGRESSION label -->
  <rect x="550" y="178" width="90" height="32" rx="4" fill="#FFF7ED" stroke="#FB923C" stroke-width="1"/>
  <text x="595" y="194" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#9A3412">REGRESSION</text>
  <text x="595" y="206" text-anchor="middle" font-size="8" fill="#9A3412">Reveals fragility</text>

  <!-- Legend -->
  <rect x="90" y="448" width="770" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="110" y1="466" x2="145" y2="466" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="152" y="470" font-size="9" fill="#6B7280">What clients expect</text>
  <line x1="330" y1="466" x2="365" y2="466" stroke="#D912AE" stroke-width="2.5"/>
  <text x="372" y="470" font-size="9" fill="#6B7280">What actually happens (diagnostic score)</text>
  <line x1="610" y1="466" x2="645" y2="466" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="652" y="470" font-size="9" fill="#6B7280">Leading indicators</text>

  <!-- Bottom note -->
  <rect x="90" y="500" width="770" height="44" rx="8" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1"/>
  <text x="106" y="518" font-size="10" fill="#92400E" font-weight="500">Typical plateau duration: 4-8 weeks.</text>
  <text x="106" y="534" font-size="10" fill="#92400E">If no movement after 8 weeks with continued investment, consider re-diagnostic to identify what is blocking the shift.</text>

  <!-- Overall trajectory note -->
  <rect x="90" y="558" width="770" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="106" y="576" font-size="10" fill="#151D1A" font-weight="500">The overall trajectory is clearly upward despite the non-linearity — progress is real, just not smooth.</text>
  <text x="106" y="590" font-size="10" fill="#6B7280">Leading indicators move BEFORE diagnostic scores. They are the early warning system.</text>

  <!-- Coaching annotations (horizontal cards) -->
  <text x="90" y="622" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#151D1A">Facilitator Coaching Notes</text>

  <!-- At the plateau -->
  <rect x="90" y="634" width="190" height="50" rx="6" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1"/>
  <rect x="90" y="634" width="3" height="50" rx="1" fill="#FBBF24"/>
  <text x="106" y="650" font-size="9" font-weight="500" fill="#92400E">At the plateau:</text>
  <text x="106" y="664" font-size="9" fill="#6B7280">"The indicators show you are</text>
  <text x="106" y="676" font-size="9" fill="#6B7280">practicing. The shift will come."</text>

  <!-- At the jump -->
  <rect x="296" y="634" width="190" height="50" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
  <rect x="296" y="634" width="3" height="50" rx="1" fill="#34D399"/>
  <text x="312" y="650" font-size="9" font-weight="500" fill="#065F46">At the jump:</text>
  <text x="312" y="664" font-size="9" fill="#6B7280">NOT a breakthrough — it's the</text>
  <text x="312" y="676" font-size="9" fill="#6B7280">accumulated result of plateau investment.</text>

  <!-- At regression -->
  <rect x="502" y="634" width="190" height="50" rx="6" fill="#FFF7ED" stroke="#FB923C" stroke-width="1"/>
  <rect x="502" y="634" width="3" height="50" rx="1" fill="#FB923C"/>
  <text x="518" y="650" font-size="9" font-weight="500" fill="#9A3412">At regression:</text>
  <text x="518" y="664" font-size="9" fill="#6B7280">NOT a failure — diagnostic info about</text>
  <text x="518" y="676" font-size="9" fill="#6B7280">where more practice time is needed.</text>

  <!-- Leading indicators -->
  <rect x="708" y="634" width="152" height="50" rx="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/>
  <rect x="708" y="634" width="3" height="50" rx="1" fill="#60A5FA"/>
  <text x="724" y="650" font-size="9" font-weight="500" fill="#1E40AF">Leading indicators:</text>
  <text x="724" y="664" font-size="9" fill="#6B7280">Move BEFORE diagnostic</text>
  <text x="724" y="676" font-size="9" fill="#6B7280">scores. Early warning system.</text>

  <!-- Footer -->
  <text x="450" y="720" text-anchor="middle" font-size="9" fill="#9CA3AF">Use this chart to set expectations with teams and leadership. Linear progress is the exception, not the norm.</text>
</svg>