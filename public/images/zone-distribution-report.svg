<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"
     font-family="'Inter', sans-serif">
  <title>Zone Distribution Report — Management Report Visualization Template</title>
  <desc>A management report visualization showing how to present team zone and competency stage distribution data for leadership. Shows a sample distribution from the FinServ Corp example engagement: 5 teams distributed across Zone 1 Developing, Zone 1 Established, and Zone 2 Emerging, with columns for all five competency stages (Emerging, Developing, Established, Consistent, Exemplary) and an investment themes summary panel. Designed for inclusion in management reports and leadership presentations.</desc>

  <!-- Background -->
  <rect width="900" height="520" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="32" y="36" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Zone Distribution: Current State</text>
  <text x="32" y="54" font-size="12" fill="#6B7280">FinServ Corp Engineering — 5 teams assessed, January 2026</text>

  <!-- ================================================ -->
  <!-- DISTRIBUTION MATRIX — 5 competency stage columns -->
  <!-- ================================================ -->

  <!-- Column headers: five stages -->
  <text x="208" y="88" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="0.06em">EMERGING</text>
  <text x="312" y="88" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="0.06em">DEVELOPING</text>
  <text x="420" y="88" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="0.06em">ESTABLISHED</text>
  <text x="534" y="88" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#115E59" letter-spacing="0.06em">CONSISTENT</text>
  <text x="644" y="88" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="0.06em">EXEMPLARY</text>

  <line x1="200" y1="94" x2="748" y2="94" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================================================ -->
  <!-- ROW: Zone 0 — empty -->
  <!-- ================================================ -->
  <text x="32" y="120" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Zone 0</text>
  <text x="130" y="120" font-size="10" fill="#9CA3AF">Baseline</text>

  <!-- Empty cells -->
  <rect x="200" y="106" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="252" y="121" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>
  <rect x="308" y="106" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="360" y="121" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>
  <rect x="416" y="106" width="110" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="471" y="121" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>
  <rect x="530" y="106" width="106" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="583" y="121" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>
  <rect x="640" y="106" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="692" y="121" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>

  <!-- ================================================ -->
  <!-- ROW: Zone 1 — 4 teams (2 Developing, 2 Established) -->
  <!-- ================================================ -->
  <text x="32" y="156" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#1E40AF">Zone 1</text>
  <text x="130" y="156" font-size="10" fill="#1E40AF">Augmenting</text>

  <!-- Emerging: 0 -->
  <rect x="200" y="142" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="252" y="157" text-anchor="middle" font-size="10" fill="#9CA3AF">0</text>

  <!-- Developing: 2 teams -->
  <rect x="308" y="142" width="104" height="22" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="360" y="157" text-anchor="middle" font-size="11" font-weight="500" fill="#1E40AF">2 teams</text>

  <!-- Established: 2 teams -->
  <rect x="416" y="142" width="110" height="22" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="471" y="157" text-anchor="middle" font-size="11" font-weight="500" fill="#1E40AF">2 teams</text>

  <!-- Consistent: 0 -->
  <rect x="530" y="142" width="106" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="583" y="157" text-anchor="middle" font-size="10" fill="#9CA3AF">0</text>

  <!-- Exemplary: 0 -->
  <rect x="640" y="142" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="692" y="157" text-anchor="middle" font-size="10" fill="#9CA3AF">0</text>

  <!-- Row total -->
  <text x="758" y="156" font-size="11" font-weight="500" fill="#1E40AF">4</text>

  <!-- ================================================ -->
  <!-- ROW: Zone 2 — 1 team (Emerging) -->
  <!-- ================================================ -->
  <text x="32" y="192" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#065F46">Zone 2</text>
  <text x="130" y="192" font-size="10" fill="#065F46">Integrating</text>

  <!-- Emerging: 1 team -->
  <rect x="200" y="178" width="104" height="22" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="252" y="193" text-anchor="middle" font-size="11" font-weight="500" fill="#065F46">1 team</text>

  <!-- Developing: 0 -->
  <rect x="308" y="178" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="360" y="193" text-anchor="middle" font-size="10" fill="#9CA3AF">0</text>

  <!-- Established: 0 -->
  <rect x="416" y="178" width="110" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="471" y="193" text-anchor="middle" font-size="10" fill="#9CA3AF">0</text>

  <!-- Consistent: 0 -->
  <rect x="530" y="178" width="106" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="583" y="193" text-anchor="middle" font-size="10" fill="#9CA3AF">0</text>

  <!-- Exemplary: 0 -->
  <rect x="640" y="178" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="692" y="193" text-anchor="middle" font-size="10" fill="#9CA3AF">0</text>

  <!-- Row total -->
  <text x="758" y="192" font-size="11" font-weight="500" fill="#065F46">1</text>

  <!-- ================================================ -->
  <!-- ROW: Zone 3 — empty -->
  <!-- ================================================ -->
  <text x="32" y="228" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Zone 3</text>
  <text x="130" y="228" font-size="10" fill="#9CA3AF">Accelerating</text>

  <rect x="200" y="214" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="252" y="229" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>
  <rect x="308" y="214" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="360" y="229" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>
  <rect x="416" y="214" width="110" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="471" y="229" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>
  <rect x="530" y="214" width="106" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="583" y="229" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>
  <rect x="640" y="214" width="104" height="22" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="692" y="229" text-anchor="middle" font-size="10" fill="#9CA3AF">--</text>

  <!-- ================================================ -->
  <!-- INTERPRETATION PANEL -->
  <!-- ================================================ -->
  <rect x="32" y="260" width="516" height="62" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="32" y="260" width="4" height="62" rx="2" fill="#D912AE"/>

  <text x="52" y="280" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#151D1A">Interpretation</text>
  <text x="52" y="296" font-size="10" fill="#6B7280">Teams cluster at Zone 1 Developing and Established. Individual AI adoption is underway</text>
  <text x="52" y="310" font-size="10" fill="#6B7280">but team-level integration has not yet begun. One team leads at Zone 2 Emerging.</text>

  <!-- Target zone summary -->
  <rect x="560" y="260" width="308" height="62" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <rect x="560" y="260" width="4" height="62" rx="2" fill="#34D399"/>

  <text x="580" y="280" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#065F46">Recommended Target</text>
  <text x="580" y="296" font-size="10" fill="#6B7280">Zone 2 Established for all 5 teams</text>
  <text x="580" y="310" font-size="10" fill="#6B7280">within 18 months (12 months for DevEx team)</text>

  <!-- ================================================ -->
  <!-- INVESTMENT THEMES PANEL -->
  <!-- ================================================ -->

  <rect x="32" y="338" width="836" height="28" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="450" y="356" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Priority Investment Themes</text>

  <!-- Theme 1 -->
  <rect x="32" y="374" width="202" height="82" rx="8" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <rect x="32" y="374" width="4" height="82" rx="2" fill="#D912AE"/>
  <rect x="52" y="382" width="42" height="16" rx="8" fill="#D912AE" fill-opacity="0.1"/>
  <text x="73" y="394" text-anchor="middle" font-size="9" font-weight="600" fill="#D912AE">HIGH</text>
  <text x="52" y="414" font-size="10" font-weight="500" fill="#151D1A">AI Tooling</text>
  <text x="52" y="428" font-size="10" font-weight="500" fill="#151D1A">Standardization</text>
  <text x="52" y="446" font-size="9" fill="#6B7280">All teams, immediate</text>

  <!-- Theme 2 -->
  <rect x="244" y="374" width="202" height="82" rx="8" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <rect x="244" y="374" width="4" height="82" rx="2" fill="#D912AE"/>
  <rect x="264" y="382" width="42" height="16" rx="8" fill="#D912AE" fill-opacity="0.1"/>
  <text x="285" y="394" text-anchor="middle" font-size="9" font-weight="600" fill="#D912AE">HIGH</text>
  <text x="264" y="414" font-size="10" font-weight="500" fill="#151D1A">AI Usage Policy</text>
  <text x="264" y="428" font-size="10" font-weight="500" fill="#151D1A">for Financial Services</text>
  <text x="264" y="446" font-size="9" fill="#6B7280">Compliance-sensitive teams</text>

  <!-- Theme 3 -->
  <rect x="456" y="374" width="202" height="82" rx="8" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <rect x="456" y="374" width="4" height="82" rx="2" fill="#D912AE"/>
  <rect x="476" y="382" width="42" height="16" rx="8" fill="#D912AE" fill-opacity="0.1"/>
  <text x="497" y="394" text-anchor="middle" font-size="9" font-weight="600" fill="#D912AE">HIGH</text>
  <text x="476" y="414" font-size="10" font-weight="500" fill="#151D1A">Shared Configuration</text>
  <text x="476" y="428" font-size="10" font-weight="500" fill="#151D1A">Templates</text>
  <text x="476" y="446" font-size="9" fill="#6B7280">Zone 2 enablement</text>

  <!-- Theme 4 -->
  <rect x="668" y="374" width="200" height="82" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="668" y="374" width="4" height="82" rx="2" fill="#6B7280"/>
  <rect x="688" y="382" width="52" height="16" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="714" y="394" text-anchor="middle" font-size="9" font-weight="500" fill="#6B7280">MEDIUM</text>
  <text x="688" y="414" font-size="10" font-weight="500" fill="#151D1A">PM and Non-Engineering</text>
  <text x="688" y="428" font-size="10" font-weight="500" fill="#151D1A">Role Training</text>
  <text x="688" y="446" font-size="9" fill="#6B7280">All teams, Zone 2 prerequisite</text>

  <!-- ================================================ -->
  <!-- KEY TAKEAWAY -->
  <!-- ================================================ -->
  <rect x="32" y="472" width="836" height="32" rx="8" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#D912AE" font-weight="500">Organizational investments unlock team-level progress. Without policy and tooling investments,</text>
  <text x="450" y="500" text-anchor="middle" font-size="11" fill="#6B7280">the four teams at Zone 1 Established will stall — not from lack of capability, but from lack of infrastructure.</text>

</svg>