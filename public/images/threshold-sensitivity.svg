<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580"
     font-family="'Inter', sans-serif">
  <title>Threshold Sensitivity Visualization</title>
  <desc>Two-panel visualization showing how the proportion of teams qualifying as Consistent changes as threshold values shift. Panel A shows composite threshold sensitivity (4.0-5.0 range) with an S-curve and ambiguity zone. Panel B shows SD threshold sensitivity (0.2-0.8 range). Current thresholds and ambiguity zones are marked.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
    <!-- Hatching pattern for ambiguity zones -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#FBBF24" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Threshold Sensitivity</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6B7280">How small changes in threshold values produce large reclassification effects</text>

  <!-- ==================== PANEL A: Composite Threshold ==================== -->
  <g transform="translate(40, 76)">
    <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#151D1A">A. Composite Threshold Sensitivity</text>

    <!-- Chart area: 380 x 240 -->
    <!-- X-axis: composite 4.0 to 5.0 (11 ticks). Mapped to x: 50-380. Per unit of 0.1: 33px -->
    <!-- Y-axis: 0% to 100%. Mapped to y: 20-240. Per 10%: 22px -->

    <!-- Y-axis -->
    <line x1="50" y1="20" x2="50" y2="240" stroke="#E5E7EB" stroke-width="1"/>
    <text x="44" y="244" text-anchor="end" font-size="8" fill="#9CA3AF">0%</text>
    <text x="44" y="200" text-anchor="end" font-size="8" fill="#9CA3AF">20%</text>
    <text x="44" y="156" text-anchor="end" font-size="8" fill="#9CA3AF">40%</text>
    <text x="44" y="112" text-anchor="end" font-size="8" fill="#9CA3AF">60%</text>
    <text x="44" y="68" text-anchor="end" font-size="8" fill="#9CA3AF">80%</text>
    <text x="44" y="24" text-anchor="end" font-size="8" fill="#9CA3AF">100%</text>
    <!-- Y-axis label -->
    <text x="10" y="132" text-anchor="middle" font-size="9" fill="#6B7280" transform="rotate(-90, 10, 132)">Est. % teams qualifying</text>

    <!-- Subtle grid -->
    <line x1="50" y1="200" x2="380" y2="200" stroke="#F3F4F6" stroke-width="0.5"/>
    <line x1="50" y1="156" x2="380" y2="156" stroke="#F3F4F6" stroke-width="0.5"/>
    <line x1="50" y1="112" x2="380" y2="112" stroke="#F3F4F6" stroke-width="0.5"/>
    <line x1="50" y1="68" x2="380" y2="68" stroke="#F3F4F6" stroke-width="0.5"/>

    <!-- X-axis -->
    <line x1="50" y1="240" x2="380" y2="240" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.0</text>
    <text x="83" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.1</text>
    <text x="116" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.2</text>
    <text x="149" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.3</text>
    <text x="182" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.4</text>
    <text x="215" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.5</text>
    <text x="248" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.6</text>
    <text x="281" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.7</text>
    <text x="314" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.8</text>
    <text x="347" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">4.9</text>
    <text x="380" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">5.0</text>
    <!-- X-axis label -->
    <text x="215" y="272" text-anchor="middle" font-size="9" fill="#6B7280">Composite threshold</text>

    <!-- Ambiguity zone: 4.5 to 4.9 -> x: 215 to 347 -->
    <rect x="215" y="20" width="132" height="220" fill="url(#hatch)"/>

    <!-- S-curve: high at low thresholds, sharp drop around 4.4-4.8, low at high thresholds -->
    <!-- Approximate logistic S-curve (inverted): -->
    <!-- 4.0: ~95%, 4.1: ~93%, 4.2: ~90%, 4.3: ~84%, 4.4: ~72%, 4.5: ~55%, 4.6: ~38%, 4.7: ~22%, 4.8: ~12%, 4.9: ~6%, 5.0: ~3% -->
    <!-- Y mapping: 0%=240, 100%=20. So 95%=31, 93%=35, 90%=42, 84%=55, 72%=82, 55%=119, 38%=156, 22%=192, 12%=214, 6%=227, 3%=233 -->
    <polyline points="50,31 83,35 116,42 149,55 182,82 215,119 248,156 281,192 314,214 347,227 380,233"
              fill="none" stroke="#151D1A" stroke-width="2"/>

    <!-- Current threshold marker at 4.7 -> x=281 -->
    <line x1="281" y1="20" x2="281" y2="240" stroke="#6A0DAD" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="281" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#6A0DAD">Current: 4.7</text>

    <!-- Data point on curve at 4.7 -->
    <circle cx="281" cy="192" r="4" fill="#6A0DAD"/>
    <text x="296" y="188" font-size="8" fill="#6A0DAD">~22%</text>

    <!-- Ambiguity label -->
    <text x="281" y="290" text-anchor="middle" font-size="8" fill="#92400E">&#177;0.2 ambiguity zone</text>
  </g>

  <!-- ==================== PANEL B: SD Threshold ==================== -->
  <g transform="translate(480, 76)">
    <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#151D1A">B. SD Threshold Sensitivity</text>

    <!-- Chart area: 380 x 240 -->
    <!-- X-axis: SD 0.2 to 0.8 (7 ticks). Mapped to x: 50-380. Per unit of 0.1: ~55px -->
    <!-- Y-axis: 0% to 100%. Same as Panel A -->

    <!-- Y-axis -->
    <line x1="50" y1="20" x2="50" y2="240" stroke="#E5E7EB" stroke-width="1"/>
    <text x="44" y="244" text-anchor="end" font-size="8" fill="#9CA3AF">0%</text>
    <text x="44" y="200" text-anchor="end" font-size="8" fill="#9CA3AF">20%</text>
    <text x="44" y="156" text-anchor="end" font-size="8" fill="#9CA3AF">40%</text>
    <text x="44" y="112" text-anchor="end" font-size="8" fill="#9CA3AF">60%</text>
    <text x="44" y="68" text-anchor="end" font-size="8" fill="#9CA3AF">80%</text>
    <text x="44" y="24" text-anchor="end" font-size="8" fill="#9CA3AF">100%</text>
    <text x="10" y="132" text-anchor="middle" font-size="9" fill="#6B7280" transform="rotate(-90, 10, 132)">Est. % teams qualifying</text>

    <line x1="50" y1="200" x2="380" y2="200" stroke="#F3F4F6" stroke-width="0.5"/>
    <line x1="50" y1="156" x2="380" y2="156" stroke="#F3F4F6" stroke-width="0.5"/>
    <line x1="50" y1="112" x2="380" y2="112" stroke="#F3F4F6" stroke-width="0.5"/>
    <line x1="50" y1="68" x2="380" y2="68" stroke="#F3F4F6" stroke-width="0.5"/>

    <!-- X-axis -->
    <line x1="50" y1="240" x2="380" y2="240" stroke="#E5E7EB" stroke-width="1"/>
    <text x="50" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">0.2</text>
    <text x="105" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">0.3</text>
    <text x="160" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">0.4</text>
    <text x="215" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">0.5</text>
    <text x="270" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">0.6</text>
    <text x="325" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">0.7</text>
    <text x="380" y="256" text-anchor="middle" font-size="8" fill="#9CA3AF">0.8</text>
    <text x="215" y="272" text-anchor="middle" font-size="9" fill="#6B7280">SD threshold</text>

    <!-- Ambiguity zone: 0.4 to 0.6 -> x: 160 to 270 -->
    <rect x="160" y="20" width="110" height="220" fill="url(#hatch)"/>

    <!-- S-curve (non-inverted): low at strict thresholds, rising as SD threshold relaxes -->
    <!-- 0.2: ~5%, 0.3: ~15%, 0.4: ~35%, 0.5: ~58%, 0.6: ~78%, 0.7: ~90%, 0.8: ~95% -->
    <!-- Y mapping: 0%=240, 100%=20. So 5%=229, 15%=207, 35%=163, 58%=112, 78%=69, 90%=42, 95%=31 -->
    <polyline points="50,229 105,207 160,163 215,112 270,69 325,42 380,31"
              fill="none" stroke="#151D1A" stroke-width="2"/>

    <!-- Current threshold marker at 0.5 -> x=215 -->
    <line x1="215" y1="20" x2="215" y2="240" stroke="#6A0DAD" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="215" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#6A0DAD">Current: 0.5</text>

    <!-- Data point on curve at 0.5 -->
    <circle cx="215" cy="112" r="4" fill="#6A0DAD"/>
    <text x="230" y="108" font-size="8" fill="#6A0DAD">~58%</text>

    <!-- Ambiguity label -->
    <text x="215" y="290" text-anchor="middle" font-size="8" fill="#92400E">&#177;0.1 ambiguity zone</text>
  </g>

  <!-- ==================== Insight annotation ==================== -->
  <line x1="40" y1="440" x2="860" y2="440" stroke="#E5E7EB" stroke-width="1"/>

  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="820" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="40" rx="1" fill="#6A0DAD"/>
    <text x="20" y="17" font-size="10" font-weight="600" fill="#151D1A">Key insight: the thresholds sit on steep parts of the curve.</text>
    <text x="20" y="32" font-size="10" fill="#6B7280">Small shifts (&#177;0.2 composite, &#177;0.1 SD) produce large reclassification effects. These are not bright lines.</text>
  </g>

  <!-- Bottom annotation -->
  <text x="450" y="530" text-anchor="middle" font-size="9" fill="#9CA3AF">These curves use hypothetical distributions. Treat scores in shaded zones as ambiguous</text>
  <text x="450" y="544" text-anchor="middle" font-size="9" fill="#9CA3AF"> -- rely on behavioral evidence from the workshop discussion.</text>
  <text x="450" y="564" text-anchor="middle" font-size="8" fill="#9CA3AF">Hatched region = ambiguity zone. Empirical calibration pending validation study (Phase 3 ROC analysis).</text>
</svg>