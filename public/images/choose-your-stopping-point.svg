<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660"
     font-family="'Inter', sans-serif">
  <title>Choose Your Stopping Point — Every Zone Is a Legitimate Destination</title>
  <desc>A strategic visual for leadership audiences showing the four AIL zones as a single path with escalating investment and legitimate stopping points. Each zone shows its value proposition, investment required, and strategic context where it is the right destination. The visual uses a journey metaphor with ascending terrain to communicate that higher zones require larger investment, while emphasizing that depth within any chosen zone is more valuable than overextension.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="660" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="32" y="36" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Choose Your Stopping Point</text>
  <text x="32" y="54" font-size="12" fill="#6B7280">Every zone is a legitimate destination when chosen through informed strategic analysis</text>

  <!-- ================================================ -->
  <!-- ASCENDING PATH — visual metaphor for escalating investment -->
  <!-- The path ascends from left to right, each zone a plateau -->
  <!-- ================================================ -->

  <!-- Path line connecting all zones -->
  <path d="M80,440 L250,440 L304,350 L500,350 L546,260 L740,260 L786,170 L940,170"
        fill="none" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>

  <!-- ================================================ -->
  <!-- ZONE 1: Augmenting (lowest plateau) -->
  <!-- ================================================ -->

  <!-- Zone card -->
  <rect x="32" y="370" width="230" height="110" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <rect x="32" y="370" width="4" height="110" rx="2" fill="#60A5FA"/>

  <!-- Zone label -->
  <text x="52" y="394" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#1E40AF">Zone 1: Augmenting</text>
  <text x="52" y="410" font-size="10" font-weight="500" fill="#6B7280">Individual tool adoption</text>

  <!-- Value proposition -->
  <text x="52" y="430" font-size="10" fill="#151D1A">Faster task completion, reduced boilerplate</text>
  <text x="52" y="444" font-size="10" fill="#151D1A">Improved onboarding across all roles</text>

  <!-- Investment tag -->
  <rect x="52" y="454" width="86" height="16" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/>
  <text x="95" y="466" text-anchor="middle" font-size="9" font-weight="500" fill="#1E40AF">3-6 months</text>

  <!-- Stopping point indicator -->
  <circle cx="276" cy="440" r="8" fill="#fff" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="276" cy="440" r="3" fill="#60A5FA"/>

  <!-- ================================================ -->
  <!-- ZONE 2: Integrating (second plateau) — emphasized as typical target -->
  <!-- ================================================ -->

  <rect x="290" y="276" width="226" height="118" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
  <rect x="290" y="276" width="4" height="118" rx="2" fill="#34D399"/>

  <!-- Typical target badge — positioned above Zone 2 card with clear gap -->
  <rect x="316" y="252" width="168" height="18" rx="9" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="400" y="265" text-anchor="middle" font-size="9" font-weight="600" fill="#065F46">TYPICAL NEAR-TERM TARGET</text>

  <text x="310" y="300" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#065F46">Zone 2: Integrating</text>
  <text x="310" y="316" font-size="10" font-weight="500" fill="#6B7280">Team-level workflow integration</text>

  <text x="310" y="336" font-size="10" fill="#151D1A">Systematic quality, faster delivery cycles</text>
  <text x="310" y="350" font-size="10" fill="#151D1A">Reduced variability across team</text>
  <text x="310" y="364" font-size="10" fill="#151D1A">Durable team-level AI capability</text>

  <rect x="310" y="372" width="112" height="16" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
  <text x="366" y="384" text-anchor="middle" font-size="9" font-weight="500" fill="#065F46">6-12 months added</text>

  <!-- Stopping point indicator -->
  <circle cx="530" cy="350" r="8" fill="#fff" stroke="#34D399" stroke-width="2"/>
  <circle cx="530" cy="350" r="3" fill="#34D399"/>

  <!-- ================================================ -->
  <!-- ZONE 3: Accelerating (third plateau) -->
  <!-- ================================================ -->

  <rect x="550" y="182" width="220" height="118" rx="8" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
  <rect x="550" y="182" width="4" height="118" rx="2" fill="#FBBF24"/>

  <text x="570" y="206" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#92400E">Zone 3: Accelerating</text>
  <text x="570" y="222" font-size="10" font-weight="500" fill="#6B7280">Role identity transformation</text>

  <text x="570" y="242" font-size="10" fill="#151D1A">Fundamentally higher leverage</text>
  <text x="570" y="256" font-size="10" fill="#151D1A">AI-native development capabilities</text>

  <!-- Warning: structural change -->
  <rect x="570" y="266" width="186" height="16" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1"/>
  <text x="663" y="278" text-anchor="middle" font-size="9" font-weight="500" fill="#92400E">12-24 months + role restructuring</text>

  <!-- Stopping point indicator -->
  <circle cx="784" cy="260" r="8" fill="#fff" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="784" cy="260" r="3" fill="#FBBF24"/>

  <!-- ================================================ -->
  <!-- ZONE 4: Industrializing (summit) -->
  <!-- ================================================ -->

  <rect x="808" y="90" width="168" height="118" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <rect x="808" y="90" width="4" height="118" rx="2" fill="#A78BFA"/>

  <text x="828" y="114" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#5B21B6">Zone 4:</text>
  <text x="828" y="130" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#5B21B6">Industrializing</text>
  <text x="828" y="146" font-size="10" font-weight="500" fill="#6B7280">AI-first production</text>

  <text x="828" y="166" font-size="10" fill="#151D1A">Strategic differentiator</text>
  <text x="828" y="180" font-size="10" fill="#151D1A">Market-defining pace</text>

  <rect x="828" y="188" width="140" height="16" rx="4" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1"/>
  <text x="898" y="200" text-anchor="middle" font-size="9" font-weight="500" fill="#5B21B6">3-5+ yrs + exec. commitment</text>

  <!-- ================================================ -->
  <!-- INVESTMENT ESCALATION — right side annotation -->
  <!-- Vertical arrow showing escalating investment -->
  <!-- ================================================ -->

  <line x1="960" y1="440" x2="960" y2="100" stroke="#6A0DAD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="956" y="270" text-anchor="end" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#6A0DAD" transform="rotate(-90, 956, 270)">Investment Required</text>

  <!-- ================================================ -->
  <!-- STRATEGIC CONTEXT CARDS — bottom row -->
  <!-- Who should stop at each zone? -->
  <!-- ================================================ -->

  <rect x="32" y="500" width="936" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="500" y="518" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">
    When is each zone the right destination?</text>
  <text x="500" y="530" text-anchor="middle" font-size="10" fill="#6B7280">The right zone matches strategic context, investment capacity, and risk appetite.</text>

  <!-- Zone 1 context -->
  <rect x="32" y="544" width="218" height="48" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/>
  <text x="141" y="561" text-anchor="middle" font-size="9" font-weight="500" fill="#1E40AF">Zone 1 is the destination when:</text>
  <text x="141" y="575" text-anchor="middle" font-size="9" fill="#6B7280">Individual fluency meets the need</text>
  <text x="141" y="587" text-anchor="middle" font-size="9" fill="#6B7280">without team process integration</text>

  <!-- Zone 2 context -->
  <rect x="262" y="544" width="218" height="48" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
  <text x="371" y="561" text-anchor="middle" font-size="9" font-weight="500" fill="#065F46">Zone 2 is the destination when:</text>
  <text x="371" y="575" text-anchor="middle" font-size="9" fill="#6B7280">Software is important but not the</text>
  <text x="371" y="587" text-anchor="middle" font-size="9" fill="#6B7280">primary competitive differentiator</text>

  <!-- Zone 3 context -->
  <rect x="492" y="544" width="218" height="48" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1"/>
  <text x="601" y="561" text-anchor="middle" font-size="9" font-weight="500" fill="#92400E">Zone 3 is the destination when:</text>
  <text x="601" y="575" text-anchor="middle" font-size="9" fill="#6B7280">Engineering leverage is a strategic</text>
  <text x="601" y="587" text-anchor="middle" font-size="9" fill="#6B7280">differentiator and competitors move</text>

  <!-- Zone 4 context -->
  <rect x="722" y="544" width="246" height="48" rx="4" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1"/>
  <text x="845" y="561" text-anchor="middle" font-size="9" font-weight="500" fill="#5B21B6">Zone 4 is the destination when:</text>
  <text x="845" y="575" text-anchor="middle" font-size="9" fill="#6B7280">AI-driven production is a core</text>
  <text x="845" y="587" text-anchor="middle" font-size="9" fill="#6B7280">strategic necessity</text>

  <!-- ================================================ -->
  <!-- KEY TAKEAWAY — bottom accent bar -->
  <!-- ================================================ -->
  <rect x="32" y="608" width="936" height="36" rx="8" fill="#fff" stroke="#6A0DAD" stroke-width="1.5"/>
  <text x="500" y="624" text-anchor="middle" font-size="11" fill="#6A0DAD" font-weight="500">A deeply competent Zone 2 organization that chose its destination through careful analysis</text>
  <text x="500" y="638" text-anchor="middle" font-size="11" fill="#6B7280">is in a stronger position than a Zone 4 organization that overextended.</text>

</svg>
