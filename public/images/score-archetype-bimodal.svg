<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300"
     font-family="'Inter', sans-serif">
  <title>Score Archetype: Bimodal Split</title>
  <desc>Dot plot showing five team members split into two distinct clusters. Members A, B, and C score 5 while D scores 2 and E scores 1, creating a bimodal distribution. The average of 3.6 is misleading because the team is split into high and low groups.</desc>

  <!-- Background -->
  <rect width="500" height="300" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="24" y="28" font-family="'DM Sans', sans-serif" font-size="16"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Bimodal Split</text>
  <text x="24" y="44" font-size="11" fill="#6B7280">Mean ~3.6  |  Two clusters visible</text>

  <!-- Chart area -->
  <line x1="60" y1="62" x2="60" y2="192" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="60" y1="192" x2="440" y2="192" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Y-axis labels. Mapping: 5=68, 4=99, 3=130, 2=161, 1=192. Step=31px -->
  <text x="52" y="72" text-anchor="end" font-size="9" fill="#9CA3AF">5</text>
  <text x="52" y="103" text-anchor="end" font-size="9" fill="#9CA3AF">4</text>
  <text x="52" y="134" text-anchor="end" font-size="9" fill="#9CA3AF">3</text>
  <text x="52" y="165" text-anchor="end" font-size="9" fill="#9CA3AF">2</text>
  <text x="52" y="196" text-anchor="end" font-size="9" fill="#9CA3AF">1</text>

  <!-- Gridlines -->
  <line x1="60" y1="68" x2="440" y2="68" stroke="#F3F4F6" stroke-width="0.5"/>
  <line x1="60" y1="99" x2="440" y2="99" stroke="#F3F4F6" stroke-width="0.5"/>
  <line x1="60" y1="130" x2="440" y2="130" stroke="#F3F4F6" stroke-width="0.5"/>
  <line x1="60" y1="161" x2="440" y2="161" stroke="#F3F4F6" stroke-width="0.5"/>

  <!-- X-axis labels -->
  <text x="120" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">A</text>
  <text x="195" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">B</text>
  <text x="270" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">C</text>
  <text x="345" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">D</text>
  <text x="420" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">E</text>

  <!-- Dots: A=5, B=5, C=5, D=2, E=1 -->
  <circle cx="120" cy="68" r="6" fill="#60A5FA" opacity="0.85"/>
  <circle cx="195" cy="68" r="6" fill="#60A5FA" opacity="0.85"/>
  <circle cx="270" cy="68" r="6" fill="#60A5FA" opacity="0.85"/>
  <circle cx="345" cy="161" r="6" fill="#FB923C" opacity="0.85"/>
  <circle cx="420" cy="192" r="6" fill="#FB923C" opacity="0.85"/>

  <!-- Cluster annotations -->
  <line x1="100" y1="58" x2="290" y2="58" stroke="#60A5FA" stroke-width="1"/>
  <text x="195" y="54" text-anchor="middle" font-size="8" fill="#1E40AF">cluster: 5</text>
  <line x1="325" y1="200" x2="440" y2="200" stroke="#FB923C" stroke-width="1"/>
  <text x="383" y="215" text-anchor="middle" font-size="8" fill="#9A3412">cluster: 1-2</text>

  <!-- Mean line at 3.6: y = 192 - (3.6-1)*31 = 192 - 80.6 = 111.4 -->
  <line x1="80" y1="111" x2="438" y2="111" stroke="#6A0DAD" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="444" y="115" font-size="9" fill="#6A0DAD">x&#772;=3.6</text>

  <!-- Interpretation block -->
  <text x="24" y="234" font-size="10" font-weight="600" fill="#151D1A">Average is misleading. Team is split.</text>
  <text x="24" y="250" font-size="10" fill="#6B7280">Check: role-based, tenure-based, or adoption split?</text>
  <text x="24" y="266" font-size="10" fill="#6A0DAD">Do NOT declare competency. Address the split.</text>
</svg>
