<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680"
     font-family="'Inter', sans-serif">
  <title>Collaborative Delivery Cadence</title>
  <desc>A 12-month horizontal timeline showing the rhythm of Collaborative Delivery activities: monthly check-ins, quarterly retrospectives, re-diagnostics, and roadmap refreshes, ending with a continue/recalibrate/disengage decision.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D912AE"/>
    </marker>
    <marker id="arrow-success" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34D399"/>
    </marker>
    <marker id="arrow-warning" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FBBF24"/>
    </marker>
    <marker id="arrow-error" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="32" y="36" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Collaborative Delivery Cadence</text>
  <text x="32" y="54" font-size="12" fill="#6B7280">12-month engagement rhythm — Phase 4 activity structure</text>

  <!-- ================================================ -->
  <!-- TIMELINE AXIS (y=76) -->
  <!-- x=120 to x=780 = 660px for 12 months = 55px per month -->
  <!-- ================================================ -->
  <line x1="120" y1="82" x2="780" y2="82" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Month markers and labels -->
  <line x1="120" y1="78" x2="120" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="120" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">1</text>

  <line x1="175" y1="78" x2="175" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="175" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">2</text>

  <line x1="230" y1="78" x2="230" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="230" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">3</text>

  <line x1="285" y1="78" x2="285" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="285" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">4</text>

  <line x1="340" y1="78" x2="340" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="340" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">5</text>

  <line x1="395" y1="78" x2="395" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="395" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">6</text>

  <line x1="450" y1="78" x2="450" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="450" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">7</text>

  <line x1="505" y1="78" x2="505" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="505" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">8</text>

  <line x1="560" y1="78" x2="560" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="560" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">9</text>

  <line x1="615" y1="78" x2="615" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="615" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">10</text>

  <line x1="670" y1="78" x2="670" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="670" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">11</text>

  <line x1="725" y1="78" x2="725" y2="86" stroke="#151D1A" stroke-width="1"/>
  <text x="725" y="98" text-anchor="middle" font-size="10" fill="#151D1A" font-weight="500">12</text>

  <text x="450" y="75" text-anchor="middle" font-size="10" fill="#9CA3AF">Month</text>

  <!-- ================================================ -->
  <!-- ROW 1: Monthly Check-Ins (y=115..185) -->
  <!-- ================================================ -->
  <rect x="16" y="115" width="94" height="70" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="63" y="146" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Monthly</text>
  <text x="63" y="160" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Check-Ins</text>

  <rect x="116" y="115" width="668" height="70" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" fill-opacity="0.5"/>

  <!-- 12 small circles for monthly check-ins -->
  <circle cx="120" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="175" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="230" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="285" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="340" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="395" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="450" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="505" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="560" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="615" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="670" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="725" cy="142" r="6" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Callout on month 3 check-in -->
  <rect x="210" y="154" width="240" height="26" rx="4" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text x="220" y="171" font-size="9" fill="#6B7280">Coaching conversation, not status meeting.</text>
  <text x="220" y="179" font-size="9" fill="#6B7280" font-style="italic" font-weight="500">Progress | Indicators | Blockers | Cross-team</text>
  <line x1="230" y1="148" x2="230" y2="154" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================================================ -->
  <!-- ROW 2: Quarterly Retrospectives (y=195..275) -->
  <!-- ================================================ -->
  <rect x="16" y="195" width="94" height="80" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="63" y="224" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Quarterly</text>
  <text x="63" y="238" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Investment</text>
  <text x="63" y="252" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Retrospectives</text>

  <rect x="116" y="195" width="668" height="80" rx="0" fill="#EDE8F5" stroke="#E5E7EB" stroke-width="1" fill-opacity="0.3"/>

  <!-- 4 larger diamonds at Q3, Q6, Q9, Q12 -->
  <rect x="224" y="226" width="14" height="14" rx="2" fill="#EDE8F5" stroke="#A78BFA" stroke-width="1.5" transform="rotate(45 231 233)"/>
  <rect x="389" y="226" width="14" height="14" rx="2" fill="#EDE8F5" stroke="#A78BFA" stroke-width="1.5" transform="rotate(45 396 233)"/>
  <rect x="554" y="226" width="14" height="14" rx="2" fill="#EDE8F5" stroke="#A78BFA" stroke-width="1.5" transform="rotate(45 561 233)"/>
  <rect x="719" y="226" width="14" height="14" rx="2" fill="#EDE8F5" stroke="#A78BFA" stroke-width="1.5" transform="rotate(45 726 233)"/>

  <!-- Labels below diamonds -->
  <text x="231" y="252" text-anchor="middle" font-size="9" fill="#5B21B6">Q1 Retro</text>
  <text x="396" y="252" text-anchor="middle" font-size="9" fill="#5B21B6">Q2 Retro</text>
  <text x="561" y="252" text-anchor="middle" font-size="9" fill="#5B21B6">Q3 Retro</text>
  <text x="726" y="252" text-anchor="middle" font-size="9" fill="#5B21B6">Q4 Retro</text>

  <!-- Callout on Q2 -->
  <rect x="370" y="258" width="268" height="14" rx="4" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text x="380" y="269" font-size="9" fill="#6B7280">Are investments producing results? &#8594; Investment Retrospective Report</text>
  <line x1="396" y1="246" x2="396" y2="258" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================================================ -->
  <!-- ROW 3: Re-Diagnostics (y=285..370) — most prominent -->
  <!-- ================================================ -->
  <rect x="16" y="285" width="94" height="85" rx="8" fill="#fff" stroke="#D912AE" stroke-width="2"/>
  <text x="63" y="319" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#D912AE">Re-Diagnostics</text>
  <text x="63" y="336" text-anchor="middle" font-size="9" fill="#6B7280">vs. baseline</text>
  <text x="63" y="354" text-anchor="middle" font-size="9" fill="#9CA3AF">Every 3–6 months</text>

  <rect x="116" y="285" width="668" height="85" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Re-diagnostic markers (prominent) at ~month 4 and ~month 10 -->
  <rect x="276" y="312" width="18" height="18" rx="0" fill="#D912AE" fill-opacity="0.15" stroke="#D912AE" stroke-width="2" transform="rotate(45 285 321)"/>
  <text x="285" y="325" text-anchor="middle" font-size="10" fill="#D912AE" font-weight="600">R1</text>

  <rect x="606" y="312" width="18" height="18" rx="0" fill="#D912AE" fill-opacity="0.15" stroke="#D912AE" stroke-width="2" transform="rotate(45 615 321)"/>
  <text x="615" y="325" text-anchor="middle" font-size="10" fill="#D912AE" font-weight="600">R2</text>

  <!-- Callout -->
  <rect x="310" y="300" width="234" height="14" rx="4" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text x="320" y="311" font-size="9" fill="#6B7280">Calibration, not a test. Same instrument as baseline.</text>
  <line x1="295" y1="307" x2="310" y2="307" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================================================ -->
  <!-- ROW 4: Roadmap Refreshes (y=380..450) -->
  <!-- ================================================ -->
  <rect x="16" y="380" width="94" height="70" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="63" y="408" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Roadmap</text>
  <text x="63" y="422" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Refreshes</text>

  <rect x="116" y="380" width="668" height="70" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" fill-opacity="0.5"/>

  <!-- Roadmap refresh blocks linked to re-diagnostics -->
  <rect x="260" y="396" width="52" height="24" rx="4" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <text x="286" y="412" text-anchor="middle" font-size="9" font-weight="500" fill="#D912AE">Refresh</text>

  <rect x="590" y="396" width="52" height="24" rx="4" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <text x="616" y="412" text-anchor="middle" font-size="9" font-weight="500" fill="#D912AE">Refresh</text>

  <!-- Dependency arrows from re-diagnostic to roadmap refresh -->
  <line x1="285" y1="340" x2="285" y2="396" stroke="#D912AE" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="615" y1="340" x2="615" y2="396" stroke="#D912AE" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Callout -->
  <rect x="340" y="398" width="228" height="22" rx="4" fill="#fff" stroke="#E5E7EB" stroke-width="1"/>
  <text x="350" y="410" font-size="9" fill="#6B7280">Update roadmap based on evidence.</text>
  <text x="350" y="418" font-size="9" fill="#6B7280">Advance milestones, extend stalled timelines, add new activities.</text>

  <!-- ================================================ -->
  <!-- DECISION DIAMOND (month 12+) -->
  <!-- ================================================ -->
  <rect x="790" y="190" width="100" height="260" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="840" y="210" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Month 12+</text>

  <!-- Decision diamond -->
  <rect x="822" y="226" width="36" height="36" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="2" transform="rotate(45 840 244)"/>
  <text x="840" y="248" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">?</text>

  <!-- Three exit paths -->
  <!-- Continue -->
  <text x="840" y="288" text-anchor="middle" font-size="10" font-weight="500" fill="#34D399">Continue</text>
  <text x="840" y="300" text-anchor="middle" font-size="9" fill="#6B7280">New cycle</text>
  <path d="M840,268 L840,278" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-success)"/>

  <!-- Recalibrate -->
  <text x="840" y="330" text-anchor="middle" font-size="10" font-weight="500" fill="#FBBF24">Recalibrate</text>
  <text x="840" y="342" text-anchor="middle" font-size="9" fill="#6B7280">New target zone</text>
  <line x1="840" y1="308" x2="840" y2="318" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arrow-warning)"/>

  <!-- Disengage -->
  <text x="840" y="372" text-anchor="middle" font-size="10" font-weight="500" fill="#F87171">Disengage</text>
  <text x="840" y="384" text-anchor="middle" font-size="9" fill="#6B7280">Team self-sufficient</text>
  <line x1="840" y1="350" x2="840" y2="360" stroke="#F87171" stroke-width="1.5" marker-end="url(#arrow-error)"/>

  <!-- Arrow from timeline to decision -->
  <line x1="784" y1="244" x2="812" y2="244" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================ -->
  <!-- BOTTOM ANNOTATIONS -->
  <!-- ================================================ -->

  <!-- Key principle -->
  <rect x="16" y="468" width="868" height="40" rx="8" fill="#F9FAFB" stroke="#D912AE" stroke-width="1.5"/>
  <text x="450" y="486" text-anchor="middle" font-size="10" fill="#D912AE" font-weight="500">Each activity type has a different purpose and conversation structure.</text>
  <text x="450" y="500" text-anchor="middle" font-size="10" fill="#6B7280">Do not let check-ins drift into retrospectives, or retrospectives drift into re-diagnostics.</text>

  <!-- Legend -->
  <rect x="16" y="524" width="868" height="46" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="36" y="544" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Legend</text>

  <circle cx="110" cy="543" r="5" fill="#fff" stroke="#6B7280" stroke-width="1.5"/>
  <text x="120" y="547" font-size="10" fill="#6B7280">Monthly check-in</text>

  <rect x="228" y="537" width="10" height="10" rx="2" fill="#EDE8F5" stroke="#A78BFA" stroke-width="1.5" transform="rotate(45 233 542)"/>
  <text x="248" y="547" font-size="10" fill="#6B7280">Quarterly retro</text>

  <rect x="362" y="537" width="10" height="10" rx="0" fill="#D912AE" fill-opacity="0.15" stroke="#D912AE" stroke-width="2" transform="rotate(45 367 542)"/>
  <text x="382" y="547" font-size="10" fill="#6B7280">Re-diagnostic</text>

  <rect x="488" y="536" width="24" height="14" rx="4" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <text x="520" y="547" font-size="10" fill="#6B7280">Roadmap refresh</text>

  <line x1="622" y1="543" x2="646" y2="543" stroke="#D912AE" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="656" y="547" font-size="10" fill="#6B7280">Dependency</text>

  <rect x="740" y="536" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 746 542)"/>
  <text x="760" y="547" font-size="10" fill="#6B7280">Decision</text>

  <!-- Narrative footer -->
  <text x="450" y="592" text-anchor="middle" font-size="11" fill="#151D1A" font-weight="500" font-family="'DM Sans', sans-serif">The cadence moves from monitoring (check-ins) to evaluation (retrospectives) to evidence (re-diagnostics) to action (roadmap refreshes).</text>
  <text x="450" y="608" text-anchor="middle" font-size="10" fill="#6B7280">Each re-diagnostic produces evidence that drives the next roadmap refresh. The cycle repeats until the team is self-sufficient.</text>

</svg>