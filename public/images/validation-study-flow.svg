<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880"
     font-family="'Inter', sans-serif">
  <title>Validation Study Flow</title>
  <desc>Three-phase sequential validation study design showing Phase 1 (Expert Validation, Months 1-6), Phase 2 (Pilot Diagnostics, Months 6-12), and Phase 3 (Longitudinal Outcomes, Months 12-24). Each phase shows its research questions, methods, key analyses, deliverables, sample sizes, and revision triggers. Arrows show how each phase feeds into the next. A feasibility assessment panel summarizes power limitations.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D912AE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="880" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">ACE Validation Study Flow</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6B7280">Mixed-methods design: qualitative expert review, facilitated pilot diagnostics, longitudinal outcome tracking</text>

  <!-- Timeline bar across top -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="800" height="20" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Phase segments -->
    <rect x="0" y="0" width="266" height="20" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/>
    <rect x="266" y="0" width="267" height="20" rx="0" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
    <rect x="533" y="0" width="267" height="20" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1"/>
    <!-- Labels -->
    <text x="133" y="14" text-anchor="middle" font-size="9" font-weight="500" fill="#1E40AF">Months 1-6</text>
    <text x="400" y="14" text-anchor="middle" font-size="9" font-weight="500" fill="#065F46">Months 6-12</text>
    <text x="667" y="14" text-anchor="middle" font-size="9" font-weight="500" fill="#92400E">Months 12-24</text>
    <!-- Tick marks for months -->
    <text x="0" y="34" font-size="7" fill="#9CA3AF">0</text>
    <text x="133" y="34" text-anchor="middle" font-size="7" fill="#9CA3AF">6</text>
    <text x="266" y="34" text-anchor="middle" font-size="7" fill="#9CA3AF">6</text>
    <text x="400" y="34" text-anchor="middle" font-size="7" fill="#9CA3AF">9</text>
    <text x="533" y="34" text-anchor="middle" font-size="7" fill="#9CA3AF">12</text>
    <text x="667" y="34" text-anchor="middle" font-size="7" fill="#9CA3AF">18</text>
    <text x="800" y="34" text-anchor="end" font-size="7" fill="#9CA3AF">24 months</text>
  </g>

  <!-- ==================== PHASE 1 ==================== -->
  <g transform="translate(24, 120)">
    <rect width="276" height="360" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
    <rect x="0" y="0" width="276" height="32" rx="8" fill="#60A5FA"/>
    <rect x="0" y="16" width="276" height="16" fill="#60A5FA"/>
    <text x="138" y="22" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#fff">Phase 1: Expert Validation</text>

    <!-- Objective -->
    <text x="16" y="50" font-size="10" font-weight="500" fill="#1E40AF">Content validity</text>
    <text x="16" y="64" font-size="9" fill="#151D1A">Do zones, questions, and investments</text>
    <text x="16" y="76" font-size="9" fill="#151D1A">match observed practitioner reality?</text>

    <!-- Research questions -->
    <line x1="16" y1="86" x2="260" y2="86" stroke="#60A5FA" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="100" font-size="9" font-weight="500" fill="#1E40AF">Research questions</text>
    <text x="16" y="114" font-size="8" fill="#6B7280">RQ1: Do zones represent distinct states?</text>
    <text x="16" y="126" font-size="8" fill="#6B7280">RQ5: Are proficiencies complete/accurate?</text>
    <text x="16" y="138" font-size="8" fill="#6B7280">RQ6: Are timelines realistic?</text>

    <!-- Methods -->
    <line x1="16" y1="148" x2="260" y2="148" stroke="#60A5FA" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="162" font-size="9" font-weight="500" fill="#1E40AF">Methods</text>
    <text x="16" y="176" font-size="8" fill="#151D1A">Structured expert interviews (8-12)</text>
    <text x="16" y="188" font-size="8" fill="#151D1A">Lawshe CVR for content items</text>
    <text x="16" y="200" font-size="8" fill="#151D1A">Thematic analysis of feedback</text>

    <!-- Sample -->
    <line x1="16" y1="210" x2="260" y2="210" stroke="#60A5FA" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="224" font-size="9" font-weight="500" fill="#1E40AF">Sample</text>
    <text x="16" y="238" font-size="8" fill="#151D1A">8-12 experts in 3 categories:</text>
    <text x="16" y="250" font-size="8" fill="#6B7280">A: AI practitioners (3-4)</text>
    <text x="16" y="262" font-size="8" fill="#6B7280">B: Agile coaches (2-3)</text>
    <text x="16" y="274" font-size="8" fill="#6B7280">C: Eng leadership (3-5)</text>

    <!-- Success criteria -->
    <line x1="16" y1="284" x2="260" y2="284" stroke="#60A5FA" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="298" font-size="9" font-weight="500" fill="#1E40AF">Success criteria</text>
    <text x="16" y="312" font-size="8" fill="#151D1A">Mean accuracy >= 3.5</text>
    <text x="16" y="324" font-size="8" fill="#151D1A">No zone accuracy &lt; 3.0</text>
    <text x="16" y="336" font-size="8" fill="#151D1A">&lt; 30% flag any question ambiguous</text>
    <text x="16" y="348" font-size="8" fill="#151D1A">80%+ agree on zone sequencing</text>
  </g>

  <!-- Arrow from Phase 1 to Phase 2 -->
  <line x1="300" y1="300" x2="312" y2="300" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Feed-forward label -->
  <text x="306" y="288" text-anchor="middle" font-size="7" fill="#D912AE" transform="rotate(-90, 306, 288)">Revised instrument</text>

  <!-- ==================== PHASE 2 ==================== -->
  <g transform="translate(312, 120)">
    <rect width="276" height="360" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
    <rect x="0" y="0" width="276" height="32" rx="8" fill="#34D399"/>
    <rect x="0" y="16" width="276" height="16" fill="#34D399"/>
    <text x="138" y="22" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#fff">Phase 2: Pilot Diagnostics</text>

    <!-- Objective -->
    <text x="16" y="50" font-size="10" font-weight="500" fill="#065F46">Construct validity + reliability</text>
    <text x="16" y="64" font-size="9" fill="#151D1A">Does the instrument produce consistent,</text>
    <text x="16" y="76" font-size="9" fill="#151D1A">actionable results across facilitators?</text>

    <!-- Research questions -->
    <line x1="16" y1="86" x2="260" y2="86" stroke="#34D399" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="100" font-size="9" font-weight="500" fill="#065F46">Research questions</text>
    <text x="16" y="114" font-size="8" fill="#6B7280">RQ2: Do questions reliably distinguish zones?</text>
    <text x="16" y="126" font-size="8" fill="#6B7280">RQ3: Is threshold predictive of behavior?</text>

    <!-- Methods -->
    <line x1="16" y1="136" x2="260" y2="136" stroke="#34D399" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="150" font-size="9" font-weight="500" fill="#065F46">Methods</text>
    <text x="16" y="164" font-size="8" fill="#151D1A">Facilitated pilot diagnostics</text>
    <text x="16" y="176" font-size="8" fill="#151D1A">Behavioral observation (subset)</text>
    <text x="16" y="188" font-size="8" fill="#151D1A">Inter-rater reliability (2 facilitators)</text>
    <text x="16" y="200" font-size="8" fill="#151D1A">Post-diagnostic interviews</text>

    <!-- Sample -->
    <line x1="16" y1="210" x2="260" y2="210" stroke="#34D399" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="224" font-size="9" font-weight="500" fill="#065F46">Sample</text>
    <text x="16" y="238" font-size="8" fill="#151D1A">3-5 organizations, 2-4 teams each</text>
    <text x="16" y="250" font-size="8" fill="#6B7280">Inter-rater: 4 teams (preliminary)</text>
    <text x="16" y="262" font-size="8" fill="#6B7280">Behavioral obs: 2+ per org</text>

    <!-- Reliability targets -->
    <line x1="16" y1="272" x2="260" y2="272" stroke="#34D399" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="286" font-size="9" font-weight="500" fill="#065F46">Reliability targets</text>
    <text x="16" y="300" font-size="8" fill="#151D1A">Cohen's kappa >= 0.7 (zone class.)</text>
    <text x="16" y="312" font-size="8" fill="#151D1A">ICC >= 0.7 (proficiency ratings)</text>
    <text x="16" y="324" font-size="8" fill="#151D1A">Investment agreement >= 80%</text>

    <!-- Revision triggers -->
    <line x1="16" y1="334" x2="260" y2="334" stroke="#34D399" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="348" font-size="8" fill="#F87171" font-weight="500">Revision triggers: misclass. >20%, kappa &lt;0.6</text>
  </g>

  <!-- Arrow from Phase 2 to Phase 3 -->
  <line x1="588" y1="300" x2="600" y2="300" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="594" y="288" text-anchor="middle" font-size="7" fill="#D912AE" transform="rotate(-90, 594, 288)">Revised instrument</text>

  <!-- ==================== PHASE 3 ==================== -->
  <g transform="translate(600, 120)">
    <rect width="276" height="360" rx="8" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
    <rect x="0" y="0" width="276" height="32" rx="8" fill="#FBBF24"/>
    <rect x="0" y="16" width="276" height="16" fill="#FBBF24"/>
    <text x="138" y="22" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#fff">Phase 3: Longitudinal Outcomes</text>

    <!-- Objective -->
    <text x="16" y="50" font-size="10" font-weight="500" fill="#92400E">Predictive validity</text>
    <text x="16" y="64" font-size="9" fill="#151D1A">Do zone classifications and investments</text>
    <text x="16" y="76" font-size="9" fill="#151D1A">predict outcomes over time?</text>

    <!-- Research questions -->
    <line x1="16" y1="86" x2="260" y2="86" stroke="#FBBF24" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="100" font-size="9" font-weight="500" fill="#92400E">Research questions</text>
    <text x="16" y="114" font-size="8" fill="#6B7280">RQ4: Do investments predict progression?</text>
    <text x="16" y="126" font-size="8" fill="#6B7280">RQ6: Are timelines realistic?</text>
    <text x="16" y="138" font-size="8" fill="#6B7280">RQ7: Are ethical provisions adopted?</text>

    <!-- Key analyses -->
    <line x1="16" y1="148" x2="260" y2="148" stroke="#FBBF24" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="162" font-size="9" font-weight="500" fill="#92400E">Key analyses</text>
    <text x="16" y="176" font-size="8" fill="#151D1A">ROC threshold refinement</text>
    <text x="16" y="188" font-size="8" fill="#151D1A">Variance decomposition eval</text>
    <text x="16" y="200" font-size="8" fill="#151D1A">Cluster analysis (zone structure)</text>
    <text x="16" y="212" font-size="8" fill="#151D1A">Investment-outcome correlation</text>
    <text x="16" y="224" font-size="8" fill="#151D1A">Test-retest reliability</text>

    <!-- Sample -->
    <line x1="16" y1="234" x2="260" y2="234" stroke="#FBBF24" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="248" font-size="9" font-weight="500" fill="#92400E">Sample</text>
    <text x="16" y="262" font-size="8" fill="#151D1A">8-15 organizations, 20-40 teams</text>
    <text x="16" y="274" font-size="8" fill="#6B7280">Inter-rater expanded: 15-20 teams</text>
    <text x="16" y="286" font-size="8" fill="#6B7280">6-month re-diagnostic intervals</text>

    <!-- Deliverables -->
    <line x1="16" y1="296" x2="260" y2="296" stroke="#FBBF24" stroke-width="0.5" opacity="0.5"/>
    <text x="16" y="310" font-size="9" font-weight="500" fill="#92400E">Deliverables</text>
    <text x="16" y="324" font-size="8" fill="#151D1A">Refined scoring thresholds</text>
    <text x="16" y="336" font-size="8" fill="#151D1A">Validated timelines</text>
    <text x="16" y="348" font-size="8" fill="#151D1A">Final validation report</text>
  </g>

  <!-- ==================== FEASIBILITY PANEL ==================== -->
  <line x1="24" y1="498" x2="876" y2="498" stroke="#E5E7EB" stroke-width="1"/>

  <text x="450" y="524" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14"
        font-weight="500" fill="#151D1A">Power and Feasibility Constraints</text>
  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#6B7280">What this study can and cannot conclude at planned sample sizes</text>

  <!-- Feasibility table -->
  <g transform="translate(50, 556)">
    <!-- Header -->
    <rect x="0" y="0" width="800" height="22" rx="4" fill="#F9FAFB"/>
    <text x="10" y="15" font-size="9" font-weight="500" fill="#151D1A">Analysis</text>
    <text x="280" y="15" font-size="9" font-weight="500" fill="#151D1A">Min. sample</text>
    <text x="380" y="15" font-size="9" font-weight="500" fill="#151D1A">Planned</text>
    <text x="470" y="15" font-size="9" font-weight="500" fill="#151D1A">Feasible?</text>
    <text x="550" y="15" font-size="9" font-weight="500" fill="#151D1A">If not: alternative</text>

    <!-- Row 1 -->
    <line x1="0" y1="24" x2="800" y2="24" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="10" y="39" font-size="8" fill="#151D1A">Cohen's kappa (4-zone)</text>
    <text x="280" y="39" font-size="8" fill="#6B7280">30-50 teams</text>
    <text x="380" y="39" font-size="8" fill="#6B7280">Ph2: 4</text>
    <rect x="470" y="28" width="32" height="14" rx="4" fill="#FFF7ED" stroke="#FB923C" stroke-width="0.8"/>
    <text x="486" y="39" text-anchor="middle" font-size="7" font-weight="500" fill="#9A3412">No</text>
    <text x="550" y="39" font-size="8" fill="#6B7280">Preliminary only; expand Ph3: 15-20</text>

    <!-- Row 2 -->
    <line x1="0" y1="46" x2="800" y2="46" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="10" y="61" font-size="8" fill="#151D1A">Spearman's rho (r=0.3)</text>
    <text x="280" y="61" font-size="8" fill="#6B7280">85 teams</text>
    <text x="380" y="61" font-size="8" fill="#6B7280">Ph3: 20-40</text>
    <rect x="470" y="50" width="32" height="14" rx="4" fill="#FFF7ED" stroke="#FB923C" stroke-width="0.8"/>
    <text x="486" y="61" text-anchor="middle" font-size="7" font-weight="500" fill="#9A3412">No</text>
    <text x="550" y="61" font-size="8" fill="#6B7280">Can detect large (r>=0.5); report limitation</text>

    <!-- Row 3 -->
    <line x1="0" y1="68" x2="800" y2="68" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="10" y="83" font-size="8" fill="#151D1A">ROC threshold refinement</text>
    <text x="280" y="83" font-size="8" fill="#6B7280">50+ teams</text>
    <text x="380" y="83" font-size="8" fill="#6B7280">Ph3: 20-40</text>
    <rect x="470" y="72" width="54" height="14" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="0.8"/>
    <text x="497" y="83" text-anchor="middle" font-size="7" font-weight="500" fill="#92400E">Marginal</text>
    <text x="550" y="83" font-size="8" fill="#6B7280">Preliminary thresholds with wide CIs</text>

    <!-- Row 4 -->
    <line x1="0" y1="90" x2="800" y2="90" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="10" y="105" font-size="8" fill="#151D1A">Cluster analysis (zone validation)</text>
    <text x="280" y="105" font-size="8" fill="#6B7280">50-100 cases</text>
    <text x="380" y="105" font-size="8" fill="#6B7280">Ph3: 20-40</text>
    <rect x="470" y="94" width="54" height="14" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="0.8"/>
    <text x="497" y="105" text-anchor="middle" font-size="7" font-weight="500" fill="#92400E">Marginal</text>
    <text x="550" y="105" font-size="8" fill="#6B7280">Exploratory; validate with larger sample</text>

    <!-- Row 5 -->
    <line x1="0" y1="112" x2="800" y2="112" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="10" y="127" font-size="8" fill="#151D1A">Cronbach's alpha (per zone)</text>
    <text x="280" y="127" font-size="8" fill="#6B7280">30+ respondents</text>
    <text x="380" y="127" font-size="8" fill="#6B7280">Ph2: 8-32</text>
    <rect x="470" y="116" width="54" height="14" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="0.8"/>
    <text x="497" y="127" text-anchor="middle" font-size="7" font-weight="500" fill="#92400E">Marginal</text>
    <text x="550" y="127" font-size="8" fill="#6B7280">Report with CIs; stabilize in Phase 3</text>

    <!-- Row 6 -->
    <line x1="0" y1="134" x2="800" y2="134" stroke="#E5E7EB" stroke-width="0.5"/>
    <text x="10" y="149" font-size="8" fill="#151D1A">EFA (4-factor structure)</text>
    <text x="280" y="149" font-size="8" fill="#6B7280">60-150</text>
    <text x="380" y="149" font-size="8" fill="#6B7280">Ph2: 8-32</text>
    <rect x="470" y="138" width="32" height="14" rx="4" fill="#FFF7ED" stroke="#FB923C" stroke-width="0.8"/>
    <text x="486" y="149" text-anchor="middle" font-size="7" font-weight="500" fill="#9A3412">No</text>
    <text x="550" y="149" font-size="8" fill="#6B7280">Defer to Ph3; use item-total correlations</text>
  </g>

  <!-- Feasibility key -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="14" height="12" rx="4" fill="#FFF7ED" stroke="#FB923C" stroke-width="0.8"/>
    <text x="18" y="10" font-size="8" fill="#6B7280">Infeasible at planned sample</text>
    <rect x="170" y="0" width="14" height="12" rx="4" fill="#FFFBEB" stroke="#FBBF24" stroke-width="0.8"/>
    <text x="188" y="10" font-size="8" fill="#6B7280">Marginal -- interpret with caution</text>
  </g>

  <!-- ==================== KNOWN LIMITATIONS ==================== -->
  <line x1="24" y1="744" x2="876" y2="744" stroke="#E5E7EB" stroke-width="1"/>

  <rect x="50" y="758" width="800" height="60" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="50" y="758" width="3" height="60" rx="1" fill="#D912AE"/>
  <text x="72" y="776" font-size="10" font-weight="500" fill="#151D1A">Known limitations of this study design</text>
  <text x="72" y="792" font-size="9" fill="#6B7280">No causal attribution (no randomized control). Zone 4 excluded (insufficient real-world examples).</text>
  <text x="72" y="806" font-size="9" fill="#6B7280">Generalizability limited to consulting-network organizations. Stability tracked to 24 months only.</text>

  <!-- Bottom -->
  <text x="450" y="840" text-anchor="middle" font-size="9" fill="#9CA3AF">See Validation Study Plan for full protocol, sampling strategy, and analysis plan.</text>
  <text x="450" y="856" text-anchor="middle" font-size="9" fill="#9CA3AF">Organization recruitment is the primary feasibility bottleneck. Build 4-6 weeks contingency into Phase 2.</text>
</svg>