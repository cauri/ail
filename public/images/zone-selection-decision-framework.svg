<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 952"
     font-family="'Inter', sans-serif">
  <title>Zone Selection Decision Framework</title>
  <desc>A decision framework card showing four factors for zone selection (risk appetite, investment capacity, strategic need, competitive position), each with a facilitation question and signal interpretation. Includes the Investment Commitment Test and push-back triggers. Designed for arm's-length readability on a laminated card.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="952" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="36" y="36" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Zone Selection Decision Framework</text>
  <text x="36" y="54" font-size="12" fill="#6B7280">Four factors for zone targeting — use during goal-setting sessions with organizational leadership</text>

  <!-- Column headers -->
  <text x="50" y="82" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="0.06em">FACTOR</text>
  <text x="170" y="82" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="0.06em">FACILITATION QUESTION</text>
  <text x="560" y="82" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="0.06em">SIGNAL INTERPRETATION</text>
  <line x1="36" y1="90" x2="844" y2="90" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Factor 1: Risk Appetite (blue) -->
  <rect x="36" y="98" width="808" height="130" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/>
  <rect x="36" y="98" width="4" height="130" rx="2" fill="#60A5FA"/>

  <text x="52" y="123" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#1E40AF">Risk</text>
  <text x="52" y="139" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#1E40AF">Appetite</text>
  <text x="52" y="163" font-size="9" fill="#6B7280">How much</text>
  <text x="52" y="175" font-size="9" fill="#6B7280">disruption can</text>
  <text x="52" y="187" font-size="9" fill="#6B7280">you absorb?</text>

  <text x="170" y="120" font-size="11" fill="#151D1A" font-style="italic">"What is the largest organizational change your</text>
  <text x="170" y="136" font-size="11" fill="#151D1A" font-style="italic">engineering org has absorbed in the past two years,</text>
  <text x="170" y="152" font-size="11" fill="#151D1A" font-style="italic">and how did it go?"</text>
  <text x="170" y="178" font-size="10" fill="#6B7280">Risk increases along the progression:</text>
  <text x="170" y="194" font-size="10" fill="#6B7280">Zone 1 = additive, Zone 2 = process, Zone 3 = structural, Zone 4 = cultural</text>

  <text x="560" y="120" font-size="11" font-weight="500" fill="#151D1A">Low risk appetite:</text>
  <text x="560" y="138" font-size="10" fill="#6B7280">Target deep Zone 2</text>
  <text x="560" y="152" font-size="10" fill="#6B7280">competency, not Zone 3.</text>
  <line x1="560" y1="164" x2="820" y2="164" stroke="#E5E7EB" stroke-width="1"/>
  <text x="560" y="180" font-size="11" font-weight="500" fill="#151D1A">High risk appetite:</text>
  <text x="560" y="198" font-size="10" fill="#6B7280">Zone 3+ may be feasible</text>
  <text x="560" y="212" font-size="10" fill="#6B7280">if other factors align.</text>

  <!-- Factor 2: Investment Capacity (emerald) -->
  <rect x="36" y="244" width="808" height="130" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
  <rect x="36" y="244" width="4" height="130" rx="2" fill="#34D399"/>

  <text x="52" y="269" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#065F46">Investment</text>
  <text x="52" y="285" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#065F46">Capacity</text>
  <text x="52" y="309" font-size="9" fill="#6B7280">Budget, time, and</text>
  <text x="52" y="321" font-size="9" fill="#6B7280">management</text>
  <text x="52" y="333" font-size="9" fill="#6B7280">attention.</text>

  <text x="170" y="266" font-size="11" fill="#151D1A" font-style="italic">"Can you name specific budget and protected</text>
  <text x="170" y="282" font-size="11" fill="#151D1A" font-style="italic">engineering time that is already allocated to this</text>
  <text x="170" y="298" font-size="11" fill="#151D1A" font-style="italic">initiative? Not aspirational — allocated."</text>
  <text x="170" y="324" font-size="10" fill="#6B7280">Zone transitions are not one-time purchases —</text>
  <text x="170" y="340" font-size="10" fill="#6B7280">they are 6-24 month sustained investments.</text>

  <text x="560" y="266" font-size="11" font-weight="500" fill="#151D1A">Limited capacity:</text>
  <text x="560" y="284" font-size="10" fill="#6B7280">Prioritize depth within</text>
  <text x="560" y="298" font-size="10" fill="#6B7280">current zone.</text>
  <line x1="560" y1="310" x2="820" y2="310" stroke="#E5E7EB" stroke-width="1"/>
  <text x="560" y="326" font-size="11" font-weight="500" fill="#151D1A">Sufficient capacity:</text>
  <text x="560" y="344" font-size="10" fill="#6B7280">Proceed with transition</text>
  <text x="560" y="358" font-size="10" fill="#6B7280">if strategy supports it.</text>

  <!-- Factor 3: Strategic Need (amber) -->
  <rect x="36" y="390" width="808" height="130" rx="8" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1"/>
  <rect x="36" y="390" width="4" height="130" rx="2" fill="#FBBF24"/>

  <text x="52" y="415" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#92400E">Strategic</text>
  <text x="52" y="431" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#92400E">Need</text>
  <text x="52" y="455" font-size="9" fill="#6B7280">Does the target</text>
  <text x="52" y="467" font-size="9" fill="#6B7280">zone serve your</text>
  <text x="52" y="479" font-size="9" fill="#6B7280">competitive</text>
  <text x="52" y="491" font-size="9" fill="#6B7280">position?</text>

  <text x="170" y="412" font-size="11" fill="#151D1A" font-style="italic">"If your teams shipped at twice the current velocity,</text>
  <text x="170" y="428" font-size="11" fill="#151D1A" font-style="italic">what would you do differently? Is that a competitive</text>
  <text x="170" y="444" font-size="11" fill="#151D1A" font-style="italic">game-changer, or would it just reduce backlog?"</text>
  <text x="170" y="470" font-size="10" fill="#6B7280">Not every org benefits equally from AI-accelerated dev.</text>
  <text x="170" y="486" font-size="10" fill="#6B7280">A regulatory-advantage company may need only Zone 2.</text>

  <text x="560" y="412" font-size="11" font-weight="500" fill="#151D1A">Low strategic need:</text>
  <text x="560" y="430" font-size="10" fill="#6B7280">Zone 3+ carries</text>
  <text x="560" y="444" font-size="10" fill="#6B7280">opportunity cost.</text>
  <line x1="560" y1="456" x2="820" y2="456" stroke="#E5E7EB" stroke-width="1"/>
  <text x="560" y="472" font-size="11" font-weight="500" fill="#151D1A">High strategic need:</text>
  <text x="560" y="490" font-size="10" fill="#6B7280">Zone 3+ investment</text>
  <text x="560" y="504" font-size="10" fill="#6B7280">may be a necessity.</text>

  <!-- Factor 4: Competitive Position (purple) -->
  <rect x="36" y="536" width="808" height="130" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1"/>
  <rect x="36" y="536" width="4" height="130" rx="2" fill="#A78BFA"/>

  <text x="52" y="561" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#5B21B6">Competitive</text>
  <text x="52" y="577" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#5B21B6">Position</text>
  <text x="52" y="601" font-size="9" fill="#6B7280">What is the</text>
  <text x="52" y="613" font-size="9" fill="#6B7280">industry doing?</text>

  <text x="170" y="558" font-size="11" fill="#151D1A" font-style="italic">"Which of your competitors are visibly investing in</text>
  <text x="170" y="574" font-size="11" fill="#151D1A" font-style="italic">AI-augmented development? What are you seeing</text>
  <text x="170" y="590" font-size="11" fill="#151D1A" font-style="italic">them do that you are not doing?"</text>
  <text x="170" y="616" font-size="10" fill="#6B7280">Competitive pressure is a prompt for deeper analysis,</text>
  <text x="170" y="632" font-size="10" fill="#6B7280">not an automatic reason to target a higher zone.</text>

  <text x="560" y="558" font-size="11" font-weight="500" fill="#151D1A">No competitor pressure:</text>
  <text x="560" y="576" font-size="10" fill="#6B7280">Focus on internal value,</text>
  <text x="560" y="590" font-size="10" fill="#6B7280">not industry trends.</text>
  <line x1="560" y1="602" x2="820" y2="602" stroke="#E5E7EB" stroke-width="1"/>
  <text x="560" y="618" font-size="11" font-weight="500" fill="#151D1A">Strong competitor moves:</text>
  <text x="560" y="636" font-size="10" fill="#6B7280">Weigh gap-closing urgency</text>
  <text x="560" y="650" font-size="10" fill="#6B7280">against investment reality.</text>

  <!-- Investment Commitment Test -->
  <rect x="36" y="686" width="520" height="118" rx="8" fill="#F9FAFB" stroke="#D912AE" stroke-width="1.5"/>
  <rect x="36" y="686" width="4" height="118" rx="2" fill="#D912AE"/>
  <text x="56" y="710" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#D912AE">Investment Commitment Test</text>
  <text x="56" y="730" font-size="11" fill="#151D1A">A target zone declaration that cannot pass this test</text>
  <text x="56" y="746" font-size="11" fill="#151D1A">is not a commitment — it is a wish.</text>
  <text x="56" y="770" font-size="11" font-weight="600" fill="#151D1A">Can you name the specific investments, assign a</text>
  <text x="56" y="786" font-size="11" font-weight="600" fill="#151D1A">person who owns each one, and give a realistic timeline?</text>

  <!-- Push-back Triggers -->
  <rect x="572" y="686" width="272" height="118" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="588" y="710" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#151D1A">Push-back triggers</text>
  <text x="588" y="730" font-size="10" fill="#6B7280">Zone 3 target at Zone 1 Emerging</text>
  <text x="588" y="746" font-size="10" fill="#6B7280">No named budget owner</text>
  <text x="588" y="762" font-size="10" fill="#6B7280">Zone 4 without maturity disclaimer</text>
  <text x="588" y="778" font-size="10" fill="#6B7280">Zone 3 but "no role changes"</text>
  <text x="588" y="794" font-size="10" fill="#6B7280">Selection driven by prestige</text>

  <!-- Footer -->
  <rect x="36" y="824" width="808" height="56" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="440" y="848" text-anchor="middle" font-size="11" font-weight="500" fill="#151D1A">A deeply competent Zone 2 organization that chose its destination through careful analysis</text>
  <text x="440" y="866" text-anchor="middle" font-size="11" fill="#6B7280">is in a stronger position than a Zone 4 organization that overextended.</text>

  <!-- Bottom guidance -->
  <rect x="36" y="894" width="808" height="48" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="440" y="918" text-anchor="middle" font-size="10" fill="#6B7280">Use this framework during goal-setting sessions. The push-back is not confrontational —</text>
  <text x="440" y="930" text-anchor="middle" font-size="10" fill="#6B7280">it is clarifying: "I want to make sure we are setting a target you can actually achieve."</text>
</svg>