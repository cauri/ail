<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300"
     font-family="'Inter', sans-serif">
  <title>Score Archetype: Uniform Low</title>
  <desc>Dot plot showing five team members (A through E) all scoring near 2-3 on a 1-5 scale, with a composite mean of 2.4. Members score between 2 and 3 consistently. Pattern indicates Emerging stage with honest self-assessment.</desc>

  <!-- Background -->
  <rect width="500" height="300" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="24" y="28" font-family="'DM Sans', sans-serif" font-size="16"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Uniform Low</text>
  <text x="24" y="44" font-size="11" fill="#6B7280">Mean ~2.4  |  SD ~0.4</text>

  <!-- Chart area -->
  <line x1="60" y1="62" x2="60" y2="192" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="60" y1="192" x2="440" y2="192" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Y-axis labels. Mapping: 5=68, 4=99, 3=130, 2=161, 1=192. Step=31px -->
  <text x="52" y="72" text-anchor="end" font-size="9" fill="#9CA3AF">5</text>
  <text x="52" y="103" text-anchor="end" font-size="9" fill="#9CA3AF">4</text>
  <text x="52" y="134" text-anchor="end" font-size="9" fill="#9CA3AF">3</text>
  <text x="52" y="165" text-anchor="end" font-size="9" fill="#9CA3AF">2</text>
  <text x="52" y="196" text-anchor="end" font-size="9" fill="#9CA3AF">1</text>

  <!-- Gridlines -->
  <line x1="60" y1="68" x2="440" y2="68" stroke="#F3F4F6" stroke-width="0.5"/>
  <line x1="60" y1="99" x2="440" y2="99" stroke="#F3F4F6" stroke-width="0.5"/>
  <line x1="60" y1="130" x2="440" y2="130" stroke="#F3F4F6" stroke-width="0.5"/>
  <line x1="60" y1="161" x2="440" y2="161" stroke="#F3F4F6" stroke-width="0.5"/>

  <!-- X-axis labels -->
  <text x="120" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">A</text>
  <text x="195" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">B</text>
  <text x="270" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">C</text>
  <text x="345" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">D</text>
  <text x="420" y="208" text-anchor="middle" font-size="9" fill="#9CA3AF">E</text>

  <!-- Dots: A=3, B=2, C=3, D=2, E=2 -->
  <circle cx="120" cy="130" r="6" fill="#FB923C" opacity="0.85"/>
  <circle cx="195" cy="161" r="6" fill="#FB923C" opacity="0.85"/>
  <circle cx="270" cy="130" r="6" fill="#FB923C" opacity="0.85"/>
  <circle cx="345" cy="161" r="6" fill="#FB923C" opacity="0.85"/>
  <circle cx="420" cy="161" r="6" fill="#FB923C" opacity="0.85"/>

  <!-- Mean line at 2.4: y = 192 - (2.4-1)*31 = 192 - 43.4 = 148.6 -->
  <line x1="80" y1="149" x2="438" y2="149" stroke="#6A0DAD" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="444" y="153" font-size="9" fill="#6A0DAD">x&#772;=2.4</text>

  <!-- Interpretation block -->
  <text x="24" y="234" font-size="10" font-weight="600" fill="#151D1A">Emerging stage. Honest assessment is valuable.</text>
  <text x="24" y="250" font-size="10" fill="#6B7280">Team is consistent but early. Investment needed.</text>
  <text x="24" y="266" font-size="10" fill="#6A0DAD">Praise honesty. Plan targeted zone investment.</text>
</svg>
