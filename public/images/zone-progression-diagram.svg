<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="520" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Zone Progression Diagram</text>
  <text x="410" y="53" text-anchor="middle" font-size="12" fill="#666">AI Competency Evaluation (ACE)</text>

  <!-- ==================== -->
  <!-- Left column: Zone progression -->
  <!-- ==================== -->

  <!-- Zone 1 -->
  <rect x="40" y="78" width="340" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Zone 1: Augmenting</text>
  <text x="210" y="120" text-anchor="middle" font-size="11" fill="#3b82f6">Individual skills shift — AI as personal assistant</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="133" x2="210" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="158" font-size="8" font-weight="600" fill="#92400e">Evaluate strategic fit</text>

  <!-- Zone 2 -->
  <rect x="40" y="172" width="340" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Zone 2: Integrating</text>
  <text x="210" y="214" text-anchor="middle" font-size="11" fill="#3b82f6">Team skills shift — AI embedded in team workflows</text>

  <!-- Arrow 2 -->
  <line x1="210" y1="227" x2="210" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="252" font-size="8" font-weight="600" fill="#92400e">Evaluate strategic fit</text>

  <!-- Zone 3 -->
  <rect x="40" y="266" width="340" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Zone 3: Accelerating</text>
  <text x="210" y="308" text-anchor="middle" font-size="11" fill="#3b82f6">Org structure shift — AI drives core development</text>

  <!-- Arrow 3 -->
  <line x1="210" y1="321" x2="210" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="346" font-size="8" font-weight="600" fill="#92400e">Evaluate strategic fit</text>

  <!-- Zone 4 -->
  <rect x="40" y="360" width="340" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="383" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Zone 4: Industrializing</text>
  <text x="210" y="402" text-anchor="middle" font-size="11" fill="#3b82f6">Org culture shift — AI-first software factory</text>

  <!-- ==================== -->
  <!-- Right column: Key messages -->
  <!-- ==================== -->

  <!-- Stopping point -->
  <rect x="430" y="78" width="350" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="605" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">Organizations choose</text>
  <text x="605" y="153" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">their stopping point</text>
  <text x="605" y="186" text-anchor="middle" font-size="10" fill="#64748b">Decision factors at every transition:</text>
  <text x="605" y="203" text-anchor="middle" font-size="10" fill="#64748b">Risk appetite · Investment capacity</text>
  <text x="605" y="220" text-anchor="middle" font-size="10" fill="#64748b">Strategic need · Competitive position</text>

  <!-- Key insight -->
  <rect x="430" y="266" width="350" height="149" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="605" y="320" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">A deeply competent Zone 2 organization</text>
  <text x="605" y="338" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">that chose its destination through careful</text>
  <text x="605" y="356" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">analysis is in a stronger position than</text>
  <text x="605" y="374" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">a Zone 4 organization that overextended.</text>
</svg>
