<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440"
     font-family="'Inter', sans-serif">
  <title>Zone Progression — Four zones of AI competency, progressing left to right</title>
  <desc>A horizontal diagram showing four zones of AI competency progression: Zone 1 (Augmenting) focuses on individual tool adoption. Zone 2 (Integrating) focuses on team workflow integration. Zone 3 (Accelerating) shifts the engineering identity so humans specify and AI implements. Zone 4 (Industrializing) transforms the production model to an AI-first software factory. Between each zone, a decision gate asks whether to continue to the next zone or deepen mastery in the current one. Organizations choose their stopping point based on strategic context. Depth within a chosen zone is more valuable than overextension across zones.</desc>

  <defs>
    <marker id="arrow-r" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#6B7280"/>
    </marker>
    <marker id="arrow-d" markerWidth="5" markerHeight="6" refX="2.5" refY="6" orient="auto">
      <polygon points="0 0, 5 0, 2.5 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="#fff" rx="8"/>

  <!-- ==================== -->
  <!-- Title Area -->
  <!-- ==================== -->
  <text x="24" y="28" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Zone Progression</text>
  <text x="24" y="48" font-size="12" fill="#6B7280">Each zone represents a different relationship with AI. Organizations choose their depth.</text>

  <!-- ==================== -->
  <!-- Zone 1: Augmenting (Blue) -->
  <!-- x: 24-199, height: 200px, top: 180, bottom: 380 -->
  <!-- ==================== -->
  <rect x="24" y="180" width="175" height="200" rx="8" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="24" y="188" width="3" height="184" rx="1.5" fill="#60A5FA"/>

  <!-- Zone 1 text -->
  <text x="40" y="200" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#1E40AF">Augmenting</text>
  <text x="40" y="216" font-size="11" fill="#6B7280">Tool adoption shift</text>
  <text x="40" y="232" font-size="10" font-weight="500" fill="#9CA3AF">Individual</text>
  <text x="40" y="248" font-size="10" fill="#6B7280">AI as personal</text>
  <text x="40" y="260" font-size="10" fill="#6B7280">assistant</text>

  <!-- Zone 1 depth bars -->
  <rect x="44" y="278" width="135" height="4" rx="2" fill="#60A5FA" opacity="0.2"/>
  <rect x="44" y="290" width="135" height="4" rx="2" fill="#60A5FA" opacity="0.2"/>
  <rect x="44" y="302" width="135" height="4" rx="2" fill="#60A5FA" opacity="0.2"/>
  <rect x="44" y="314" width="135" height="4" rx="2" fill="#60A5FA" opacity="0.2"/>
  <rect x="44" y="326" width="135" height="4" rx="2" fill="#60A5FA" opacity="0.2"/>
  <rect x="44" y="338" width="135" height="4" rx="2" fill="#60A5FA" opacity="0.15"/>
  <rect x="44" y="350" width="135" height="4" rx="2" fill="#60A5FA" opacity="0.1"/>
  <rect x="44" y="362" width="135" height="4" rx="2" fill="#60A5FA" opacity="0.07"/>

  <!-- ==================== -->
  <!-- Gate 1 (between Zone 1-2) -->
  <!-- x: 199-231 (32px wide), center: 215 -->
  <!-- ==================== -->
  <line x1="215" y1="175" x2="215" y2="380" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Fork icon at gate 1 -->
  <circle cx="215" cy="265" r="3" fill="#6B7280"/>
  <line x1="218" y1="265" x2="228" y2="265" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow-r)"/>
  <line x1="215" y1="268" x2="215" y2="278" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow-d)"/>

  <!-- Gate 1 labels -->
  <text x="215" y="300" text-anchor="middle" font-size="8" fill="#9CA3AF">Continue or</text>
  <text x="215" y="310" text-anchor="middle" font-size="8" fill="#9CA3AF">deepen here</text>
  <text x="215" y="330" text-anchor="middle" font-size="7.5" font-weight="500" fill="#9CA3AF">3&#x2013;6 months</text>

  <!-- ==================== -->
  <!-- Zone 2: Integrating (Emerald) -->
  <!-- x: 231-416, height: 215px, top: 165, bottom: 380 -->
  <!-- ==================== -->
  <rect x="231" y="165" width="185" height="215" rx="8" fill="#ECFDF5" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="231" y="173" width="3" height="199" rx="1.5" fill="#34D399"/>

  <!-- Zone 2 text -->
  <text x="247" y="185" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#065F46">Integrating</text>
  <text x="247" y="201" font-size="11" fill="#6B7280">Workflow integration</text>
  <text x="247" y="213" font-size="11" fill="#6B7280">shift</text>
  <text x="247" y="231" font-size="10" font-weight="500" fill="#9CA3AF">Team</text>
  <text x="247" y="247" font-size="10" fill="#6B7280">Shared team practices</text>

  <!-- Zone 2 depth bars -->
  <rect x="251" y="268" width="145" height="4" rx="2" fill="#34D399" opacity="0.2"/>
  <rect x="251" y="280" width="145" height="4" rx="2" fill="#34D399" opacity="0.2"/>
  <rect x="251" y="292" width="145" height="4" rx="2" fill="#34D399" opacity="0.2"/>
  <rect x="251" y="304" width="145" height="4" rx="2" fill="#34D399" opacity="0.2"/>
  <rect x="251" y="316" width="145" height="4" rx="2" fill="#34D399" opacity="0.2"/>
  <rect x="251" y="328" width="145" height="4" rx="2" fill="#34D399" opacity="0.15"/>
  <rect x="251" y="340" width="145" height="4" rx="2" fill="#34D399" opacity="0.1"/>
  <rect x="251" y="352" width="145" height="4" rx="2" fill="#34D399" opacity="0.07"/>

  <!-- ==================== -->
  <!-- Gate 2 (between Zone 2-3) -->
  <!-- x: 416-448, center: 432 -->
  <!-- ==================== -->
  <line x1="432" y1="160" x2="432" y2="380" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Fork icon at gate 2 -->
  <circle cx="432" cy="258" r="3" fill="#6B7280"/>
  <line x1="435" y1="258" x2="445" y2="258" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow-r)"/>
  <line x1="432" y1="261" x2="432" y2="271" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow-d)"/>

  <!-- Gate 2 labels -->
  <text x="432" y="293" text-anchor="middle" font-size="8" fill="#9CA3AF">Continue or</text>
  <text x="432" y="303" text-anchor="middle" font-size="8" fill="#9CA3AF">deepen here</text>
  <text x="432" y="323" text-anchor="middle" font-size="7.5" font-weight="500" fill="#9CA3AF">12&#x2013;24 months</text>

  <!-- ==================== -->
  <!-- Zone 3: Accelerating (Amber) -->
  <!-- x: 448-633, height: 230px, top: 150, bottom: 380 -->
  <!-- ==================== -->
  <rect x="448" y="150" width="185" height="230" rx="8" fill="#FFFBEB" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="448" y="158" width="3" height="214" rx="1.5" fill="#FBBF24"/>

  <!-- Zone 3 text -->
  <text x="464" y="170" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#92400E">Accelerating</text>
  <text x="464" y="186" font-size="11" fill="#6B7280">Engineering identity</text>
  <text x="464" y="198" font-size="11" fill="#6B7280">shift</text>
  <text x="464" y="216" font-size="10" font-weight="500" fill="#9CA3AF">Role</text>
  <text x="464" y="232" font-size="10" fill="#6B7280">Humans specify,</text>
  <text x="464" y="244" font-size="10" fill="#6B7280">AI implements</text>

  <!-- Zone 3 depth bars -->
  <rect x="468" y="264" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.25"/>
  <rect x="468" y="276" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.25"/>
  <rect x="468" y="288" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.25"/>
  <rect x="468" y="300" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.25"/>
  <rect x="468" y="312" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.25"/>
  <rect x="468" y="324" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.2"/>
  <rect x="468" y="336" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.15"/>
  <rect x="468" y="348" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.1"/>
  <rect x="468" y="360" width="145" height="4" rx="2" fill="#FBBF24" opacity="0.07"/>

  <!-- ==================== -->
  <!-- Gate 3 (between Zone 3-4) -->
  <!-- x: 633-665, center: 649 -->
  <!-- ==================== -->
  <line x1="649" y1="145" x2="649" y2="380" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Fork icon at gate 3 -->
  <circle cx="649" cy="250" r="3" fill="#6B7280"/>
  <line x1="652" y1="250" x2="662" y2="250" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow-r)"/>
  <line x1="649" y1="253" x2="649" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow-d)"/>

  <!-- Gate 3 labels -->
  <text x="649" y="285" text-anchor="middle" font-size="8" fill="#9CA3AF">Continue or</text>
  <text x="649" y="295" text-anchor="middle" font-size="8" fill="#9CA3AF">deepen here</text>
  <text x="649" y="315" text-anchor="middle" font-size="7.5" font-weight="500" fill="#9CA3AF">3&#x2013;5+ years</text>

  <!-- ==================== -->
  <!-- Zone 4: Industrializing (Purple) -->
  <!-- x: 665-856, height: 245px, top: 135, bottom: 380 -->
  <!-- ==================== -->
  <rect x="665" y="135" width="191" height="245" rx="8" fill="#F5F3FF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="665" y="143" width="3" height="229" rx="1.5" fill="#A78BFA"/>

  <!-- Zone 4 text -->
  <text x="681" y="155" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#5B21B6">Industrializing</text>
  <text x="681" y="171" font-size="11" fill="#6B7280">Production model shift</text>
  <text x="681" y="189" font-size="10" font-weight="500" fill="#9CA3AF">Organization</text>
  <text x="681" y="205" font-size="10" fill="#6B7280">AI-first software</text>
  <text x="681" y="217" font-size="10" fill="#6B7280">factory</text>

  <!-- Zone 4 depth bars -->
  <rect x="685" y="237" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.2"/>
  <rect x="685" y="249" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.2"/>
  <rect x="685" y="261" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.2"/>
  <rect x="685" y="273" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.2"/>
  <rect x="685" y="285" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.2"/>
  <rect x="685" y="297" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.15"/>
  <rect x="685" y="309" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.1"/>
  <rect x="685" y="321" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.07"/>
  <rect x="685" y="333" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.05"/>
  <rect x="685" y="345" width="151" height="4" rx="2" fill="#A78BFA" opacity="0.04"/>

  <!-- ==================== -->
  <!-- Shared bottom baseline -->
  <!-- ==================== -->
  <line x1="24" y1="380" x2="856" y2="380" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ==================== -->
  <!-- Bottom Annotation -->
  <!-- ==================== -->
  <text x="440" y="406" text-anchor="middle" font-size="11" font-weight="500" fill="#151D1A">Depth within a chosen zone is more valuable than overextension across zones.</text>
  <text x="440" y="424" text-anchor="middle" font-size="10" fill="#6B7280">The right zone is the one that matches your strategic context.</text>

</svg>
