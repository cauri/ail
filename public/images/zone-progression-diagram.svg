<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540"
     font-family="'Inter', sans-serif">
  <title>Zone Progression Diagram</title>
  <desc>A horizontal flow diagram showing four zones of AI competency progression (Augmenting, Integrating, Accelerating, Industrializing) connected by decision gates. Each zone uses its own color. Organizations choose their stopping point based on strategic context.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="36" y="36" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Zone Progression Diagram</text>
  <text x="36" y="54" font-size="12" fill="#6B7280">AI Competency Evaluation — Progressive competency model</text>

  <!-- ==================== -->
  <!-- Left column: Zone progression (vertical) -->
  <!-- ==================== -->

  <!-- Zone 1: Blue -->
  <rect x="36" y="80" width="350" height="56" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="52" y="104" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#1E40AF">Zone 1: Augmenting</text>
  <text x="52" y="122" font-size="11" fill="#6B7280">Tool adoption shift — AI as personal assistant</text>

  <!-- Arrow + Gate 1 -->
  <line x1="211" y1="136" x2="211" y2="165" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="185" y="146" width="14" height="14" rx="1" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" transform="rotate(45 192 153)"/>
  <text x="224" y="158" font-size="9" font-weight="500" fill="#6B7280">Evaluate strategic fit</text>

  <!-- Zone 2: Emerald -->
  <rect x="36" y="178" width="350" height="56" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="52" y="202" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#065F46">Zone 2: Integrating</text>
  <text x="52" y="220" font-size="11" fill="#6B7280">Workflow integration shift — shared team practices</text>

  <!-- Arrow + Gate 2 -->
  <line x1="211" y1="234" x2="211" y2="263" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="185" y="244" width="14" height="14" rx="1" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" transform="rotate(45 192 251)"/>
  <text x="224" y="256" font-size="9" font-weight="500" fill="#6B7280">Evaluate strategic fit</text>

  <!-- Zone 3: Amber -->
  <rect x="36" y="276" width="350" height="56" rx="8" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="52" y="300" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#92400E">Zone 3: Accelerating</text>
  <text x="52" y="318" font-size="11" fill="#6B7280">Engineering identity shift — AI drives core work</text>

  <!-- Arrow + Gate 3 -->
  <line x1="211" y1="332" x2="211" y2="361" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="185" y="342" width="14" height="14" rx="1" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2" transform="rotate(45 192 349)"/>
  <text x="224" y="354" font-size="9" font-weight="500" fill="#6B7280">Evaluate strategic fit</text>

  <!-- Zone 4: Purple -->
  <rect x="36" y="374" width="350" height="56" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="52" y="398" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#5B21B6">Zone 4: Industrializing</text>
  <text x="52" y="416" font-size="11" fill="#6B7280">Production model shift — AI-first software factory</text>

  <!-- ==================== -->
  <!-- Right column: Key messages -->
  <!-- ==================== -->

  <!-- Stopping point message -->
  <rect x="430" y="80" width="414" height="140" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="446" y="110" font-family="'DM Sans', sans-serif" font-size="16" font-weight="500" fill="#151D1A" letter-spacing="-0.03em">Organizations choose their stopping point</text>
  <text x="446" y="136" font-size="11" fill="#6B7280">The right zone is the one that matches your strategic context.</text>
  <line x1="446" y1="152" x2="820" y2="152" stroke="#E5E7EB" stroke-width="1"/>
  <text x="446" y="172" font-size="11" font-weight="500" fill="#151D1A">Decision factors at every transition:</text>
  <text x="446" y="192" font-size="11" fill="#6B7280">Risk appetite · Investment capacity · Strategic need · Competitive position</text>

  <!-- Key insight quote -->
  <rect x="430" y="240" width="414" height="190" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="430" y="240" width="3" height="190" rx="1.5" fill="#D912AE"/>
  <text x="450" y="268" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#151D1A">Key insight</text>
  <text x="450" y="300" font-size="12" fill="#151D1A" font-style="italic">A deeply competent Zone 2 organization</text>
  <text x="450" y="318" font-size="12" fill="#151D1A" font-style="italic">that chose its destination through careful</text>
  <text x="450" y="336" font-size="12" fill="#151D1A" font-style="italic">analysis is in a stronger position than</text>
  <text x="450" y="354" font-size="12" fill="#151D1A" font-style="italic">a Zone 4 organization that overextended.</text>
  <text x="450" y="386" font-size="10" fill="#6B7280">— ACE Progressive Competency Model</text>

  <!-- Bottom annotation -->
  <rect x="36" y="456" width="808" height="56" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="440" y="480" text-anchor="middle" font-size="11" fill="#151D1A" font-weight="500">Organizations choose their stopping point — the right zone is the one that matches your strategic context.</text>
  <text x="440" y="498" text-anchor="middle" font-size="10" fill="#6B7280">Not every organization needs to reach Zone 4. Depth within a chosen zone is more valuable than overextension.</text>
</svg>