<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700"
     font-family="'Inter', sans-serif">
  <title>Engagement Lifecycle — Two Concurrent Tracks</title>
  <desc>Swim-lane diagram showing the ACE engagement as two concurrent tracks: the Assessment Track (Discovery, Diagnostic, Goal Setting and Roadmap) run by the ACE Facilitator, and the Delivery Track (Collaborative Delivery) run by Embedded Artisans starting from the beginning of the engagement. Assessment track boundaries are decision points where stopping is legitimate. Artisan observations feed back to the Facilitator.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60A5FA"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34D399"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D912AE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="32" y="34" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Engagement Lifecycle</text>
  <text x="32" y="54" font-size="12" fill="#6B7280">Two concurrent tracks from day one: assessment informs delivery, delivery generates assessment signal</text>

  <!-- ================================================ -->
  <!-- TRACK LABELS -->
  <!-- ================================================ -->

  <!-- Assessment track label -->
  <rect x="120" y="78" width="380" height="28" rx="6" fill="#EDF2FE" stroke="#60A5FA" stroke-width="1"/>
  <text x="310" y="96" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#1E40AF">Assessment Track  ·  Facilitator-led  ·  4-8 weeks</text>

  <!-- Delivery track label -->
  <rect x="520" y="78" width="348" height="28" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="694" y="96" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#065F46">Delivery Track  ·  Embedded Artisans  ·  3-18 months</text>

  <!-- ================================================ -->
  <!-- SWIM LANE: ACE Facilitator -->
  <!-- ================================================ -->

  <rect x="32" y="124" width="836" height="220" rx="8" fill="#EDF2FE" fill-opacity="0.2" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Lane label -->
  <text x="48" y="142" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#1E40AF" letter-spacing="0.06em">ACE FACILITATOR</text>

  <!-- Phase 1: Discovery -->
  <rect x="56" y="160" width="160" height="80" rx="8" fill="#fff" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="136" y="182" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#1E40AF">1. Discovery</text>
  <text x="136" y="198" text-anchor="middle" font-size="10" fill="#6B7280">Stakeholder interviews</text>
  <text x="136" y="212" text-anchor="middle" font-size="10" fill="#6B7280">Context analysis</text>
  <text x="136" y="228" text-anchor="middle" font-size="9" fill="#9CA3AF">2-4 weeks</text>

  <!-- Arrow 1→Gate 1 -->
  <line x1="216" y1="200" x2="238" y2="200" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Gate 1 -->
  <rect x="246" y="186" width="28" height="28" rx="3" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 260 200)"/>
  <text x="260" y="204" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">?</text>

  <!-- Arrow Gate 1→Phase 2 -->
  <line x1="274" y1="200" x2="296" y2="200" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Phase 2: Diagnostic -->
  <rect x="304" y="160" width="160" height="80" rx="8" fill="#fff" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="384" y="182" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#1E40AF">2. Diagnostic</text>
  <text x="384" y="198" text-anchor="middle" font-size="10" fill="#6B7280">Team workshops</text>
  <text x="384" y="212" text-anchor="middle" font-size="10" fill="#6B7280">Score analysis + reports</text>
  <text x="384" y="228" text-anchor="middle" font-size="9" fill="#9CA3AF">2-3 weeks</text>

  <!-- Arrow 2→Gate 2 -->
  <line x1="464" y1="200" x2="486" y2="200" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Gate 2 -->
  <rect x="494" y="186" width="28" height="28" rx="3" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 508 200)"/>
  <text x="508" y="204" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">?</text>

  <!-- Arrow Gate 2→Phase 3 -->
  <line x1="522" y1="200" x2="544" y2="200" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Phase 3: Goal Setting + Roadmap -->
  <rect x="552" y="160" width="160" height="80" rx="8" fill="#fff" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="632" y="182" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#1E40AF">3. Goal Setting</text>
  <text x="632" y="198" text-anchor="middle" font-size="10" fill="#6B7280">Leadership session</text>
  <text x="632" y="212" text-anchor="middle" font-size="10" fill="#6B7280">Team roadmaps</text>
  <text x="632" y="228" text-anchor="middle" font-size="9" fill="#9CA3AF">1-2 weeks</text>

  <!-- Arrow Phase 3→Periodic -->
  <line x1="712" y1="200" x2="734" y2="200" stroke="#D912AE" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Periodic assessment box -->
  <rect x="742" y="160" width="114" height="80" rx="8" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <text x="799" y="180" text-anchor="middle" font-size="10" font-weight="500" fill="#D912AE">Periodic</text>
  <text x="799" y="194" text-anchor="middle" font-size="10" font-weight="500" fill="#D912AE">Assessment</text>
  <text x="799" y="212" text-anchor="middle" font-size="9" fill="#6B7280">Check-ins, retros</text>
  <text x="799" y="226" text-anchor="middle" font-size="9" fill="#6B7280">Re-diagnostic</text>

  <!-- Loop arrow on periodic -->
  <path d="M 820 240 C 820 258, 778 258, 778 240" fill="none" stroke="#D912AE" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="799" y="268" text-anchor="middle" font-size="8" fill="#D912AE">Repeats until self-sufficient</text>

  <!-- Gate exit annotations -->
  <text x="260" y="248" text-anchor="middle" font-size="9" fill="#FBBF24" font-weight="500">Exit OK</text>
  <text x="508" y="248" text-anchor="middle" font-size="9" fill="#FBBF24" font-weight="500">Exit OK</text>

  <!-- Deliverables row under facilitator -->
  <text x="136" y="302" text-anchor="middle" font-size="9" fill="#9CA3AF">Context report</text>
  <text x="384" y="296" text-anchor="middle" font-size="9" fill="#9CA3AF">Team reports</text>
  <text x="384" y="308" text-anchor="middle" font-size="9" fill="#9CA3AF">Management report</text>
  <text x="632" y="296" text-anchor="middle" font-size="9" fill="#9CA3AF">Target zone declaration</text>
  <text x="632" y="308" text-anchor="middle" font-size="9" fill="#9CA3AF">Roadmap + investment plan</text>
  <text x="799" y="296" text-anchor="middle" font-size="9" fill="#9CA3AF">Updated roadmaps</text>
  <text x="799" y="308" text-anchor="middle" font-size="9" fill="#9CA3AF">Progress reports</text>

  <!-- Divider -->
  <line x1="32" y1="330" x2="868" y2="330" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Observation flow arrow -->
  <text x="450" y="348" text-anchor="middle" font-size="10" fill="#6B7280">Observations flow up (morale, adoption, resistance) · Disclosed to team</text>
  <line x1="292" y1="356" x2="292" y2="342" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="450" y1="356" x2="450" y2="342" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="608" y1="356" x2="608" y2="342" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- ================================================ -->
  <!-- SWIM LANE: Embedded Artisans -->
  <!-- ================================================ -->

  <rect x="32" y="366" width="836" height="186" rx="8" fill="#ECFDF5" fill-opacity="0.15" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Lane label -->
  <text x="48" y="384" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#065F46" letter-spacing="0.06em">EMBEDDED ARTISANS</text>

  <!-- Full-width delivery bar -->
  <rect x="56" y="400" width="800" height="70" rx="8" fill="#fff" stroke="#34D399" stroke-width="1.5"/>

  <!-- Early embedding phase -->
  <rect x="68" y="410" width="200" height="50" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="168" y="430" text-anchor="middle" font-size="11" font-weight="500" fill="#065F46">Early Embedding</text>
  <text x="168" y="446" text-anchor="middle" font-size="9" fill="#6B7280">Assess discipline, build AI-ready habits</text>

  <!-- Arrow -->
  <line x1="268" y1="435" x2="290" y2="435" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Full delivery phase -->
  <rect x="298" y="410" width="340" height="50" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="468" y="430" text-anchor="middle" font-size="11" font-weight="500" fill="#065F46">Full Collaborative Delivery</text>
  <text x="468" y="446" text-anchor="middle" font-size="9" fill="#6B7280">Paired work, fast feedback loops, continuous validation</text>

  <!-- Arrow -->
  <line x1="638" y1="435" x2="660" y2="435" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Ramp-down -->
  <rect x="668" y="410" width="176" height="50" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="756" y="430" text-anchor="middle" font-size="11" font-weight="500" fill="#065F46">Evidence-Based Ramp-Down</text>
  <text x="756" y="446" text-anchor="middle" font-size="9" fill="#6B7280">Team demonstrates self-sufficiency</text>

  <!-- Cross-craft annotation -->
  <text x="56" y="494" font-size="10" fill="#151D1A">Engineers + PMs + Designers working the same backlog, shoulder-to-shoulder</text>
  <text x="56" y="510" font-size="10" fill="#6B7280" font-style="italic">Assessment track formalizes what the delivery track has already begun.</text>
  <text x="56" y="526" font-size="10" fill="#6B7280" font-style="italic">Delivery track generates the observational signal that makes assessment accurate.</text>

  <!-- ================================================ -->
  <!-- KEY PRINCIPLE -->
  <!-- ================================================ -->
  <rect x="32" y="550" width="836" height="44" rx="8" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <text x="450" y="568" text-anchor="middle" font-size="11" fill="#D912AE" font-weight="500">Each assessment gate is a genuine decision point. Stopping after any phase is legitimate.</text>
  <text x="450" y="584" text-anchor="middle" font-size="10" fill="#6B7280">Commitment momentum from early Artisan embedding should be surfaced and discussed at each decision point.</text>

  <!-- ================================================ -->
  <!-- LEGEND -->
  <!-- ================================================ -->
  <rect x="32" y="610" width="836" height="44" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="52" y="632" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#151D1A">Legend</text>

  <rect x="110" y="624" width="18" height="14" rx="4" fill="#fff" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="134" y="635" font-size="9" fill="#6B7280">Facilitator activity</text>

  <rect x="240" y="624" width="18" height="14" rx="4" fill="#fff" stroke="#34D399" stroke-width="1.5"/>
  <text x="264" y="635" font-size="9" fill="#6B7280">Artisan activity</text>

  <rect x="360" y="625" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 366 631)"/>
  <text x="380" y="635" font-size="9" fill="#6B7280">Decision gate</text>

  <rect x="470" y="624" width="18" height="14" rx="4" fill="#fff" stroke="#D912AE" stroke-width="1.5"/>
  <text x="494" y="635" font-size="9" fill="#6B7280">Periodic assessment</text>

  <line x1="610" y1="631" x2="634" y2="631" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="642" y="635" font-size="9" fill="#6B7280">Observations flow</text>

  <!-- Footer -->
  <text x="450" y="676" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">Delivery begins from day one. The assessment track informs and refines what is already underway.</text>

</svg>
