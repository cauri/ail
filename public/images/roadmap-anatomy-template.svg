<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720"
     font-family="'Inter', sans-serif">
  <title>Roadmap Anatomy Template</title>
  <desc>A content-agnostic template showing the four-lane structure of a zone transition roadmap: Organizational Investments, Team Activities, Milestones, and Leading Indicators across three phases, with phase gates and a re-diagnostic loop.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D912AE"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60A5FA"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="32" y="36" font-family="'DM Sans', sans-serif" font-size="20"
        font-weight="400" fill="#151D1A" letter-spacing="-0.03em">Roadmap Anatomy Template</text>
  <text x="32" y="54" font-size="12" fill="#6B7280">Structure of a zone transition roadmap — content-agnostic</text>

  <!-- ================================================ -->
  <!-- TIMELINE HEADER (y=72..108) -->
  <!-- ================================================ -->
  <!-- Timeline bar: x=150..860 = 710px, 3 phases ~237px each -->
  <rect x="150" y="72" width="710" height="36" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Phase labels -->
  <text x="269" y="89" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#151D1A">Phase 1</text>
  <text x="269" y="103" text-anchor="middle" font-size="10" fill="#6B7280">Months 1–2</text>

  <text x="505" y="89" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#151D1A">Phase 2</text>
  <text x="505" y="103" text-anchor="middle" font-size="10" fill="#6B7280">Months 3–4</text>

  <text x="741" y="89" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#151D1A">Phase 3</text>
  <text x="741" y="103" text-anchor="middle" font-size="10" fill="#6B7280">Months 5–6</text>

  <!-- Phase divider lines -->
  <line x1="387" y1="72" x2="387" y2="560" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="623" y1="72" x2="623" y2="560" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Phase gate diamonds (positioned at top of divider lines) -->
  <rect x="381" y="65" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 387 71)"/>
  <rect x="617" y="65" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 623 71)"/>

  <!-- ================================================ -->
  <!-- LANE 1: Organizational Investments (y=118..258) -->
  <!-- Most prominent lane — tallest -->
  <!-- ================================================ -->

  <!-- Lane label -->
  <rect x="16" y="118" width="124" height="140" rx="8" fill="#EDF2FE" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="78" y="172" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#1E40AF">Organizational</text>
  <text x="78" y="188" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#1E40AF">Investments</text>
  <text x="78" y="210" text-anchor="middle" font-size="9" fill="#D912AE" font-weight="500">MOST IMPORTANT</text>

  <!-- Lane background -->
  <rect x="150" y="118" width="710" height="140" rx="0" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Investment A: Phase 1 only -->
  <rect x="168" y="134" width="200" height="28" rx="4" fill="#fff" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="268" y="153" text-anchor="middle" font-size="11" font-weight="500" fill="#1E40AF">Investment A (prereq for Phase 2)</text>

  <!-- Dependency arrow: A must complete before Phase 2 -->
  <line x1="368" y1="148" x2="400" y2="148" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Investment C: Phase 2 only -->
  <rect x="410" y="134" width="195" height="28" rx="4" fill="#fff" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="507" y="153" text-anchor="middle" font-size="11" font-weight="500" fill="#1E40AF">Investment C (Phase 2 only)</text>

  <!-- Investment B: spans all 3 phases -->
  <rect x="168" y="172" width="674" height="28" rx="4" fill="#EDF2FE" stroke="#60A5FA" stroke-width="1"/>
  <text x="505" y="191" text-anchor="middle" font-size="11" font-weight="500" fill="#1E40AF">Investment B (spans Phases 1–3)</text>

  <!-- Lane annotation -->
  <text x="162" y="240" font-size="10" fill="#6B7280" font-style="italic">Investments are what the ORGANIZATION provides. Without them, activities below cannot succeed.</text>

  <!-- ================================================ -->
  <!-- LANE 2: Team Activities (y=268..380) -->
  <!-- ================================================ -->

  <rect x="16" y="268" width="124" height="112" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="78" y="318" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#065F46">Team</text>
  <text x="78" y="334" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#065F46">Activities</text>

  <rect x="150" y="268" width="710" height="112" fill="#ECFDF5" stroke="#E5E7EB" stroke-width="1" fill-opacity="0.4"/>

  <!-- Activity X -->
  <rect x="180" y="286" width="140" height="26" rx="4" fill="#fff" stroke="#34D399" stroke-width="1.5"/>
  <text x="250" y="303" text-anchor="middle" font-size="11" font-weight="500" fill="#065F46">Activity X</text>

  <!-- Activity Y -->
  <rect x="430" y="286" width="140" height="26" rx="4" fill="#fff" stroke="#34D399" stroke-width="1.5"/>
  <text x="500" y="303" text-anchor="middle" font-size="11" font-weight="500" fill="#065F46">Activity Y</text>

  <!-- Activity Z -->
  <rect x="670" y="286" width="140" height="26" rx="4" fill="#fff" stroke="#34D399" stroke-width="1.5"/>
  <text x="740" y="303" text-anchor="middle" font-size="11" font-weight="500" fill="#065F46">Activity Z</text>

  <!-- Dependency arrows: activities up to investments (dotted) -->
  <line x1="250" y1="286" x2="250" y2="210" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="500" y1="286" x2="500" y2="210" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="740" y1="286" x2="740" y2="210" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- Lane annotation -->
  <text x="162" y="366" font-size="10" fill="#6B7280" font-style="italic">Activities are what the TEAM does. Each requires a supporting investment above.</text>

  <!-- ================================================ -->
  <!-- LANE 3: Milestones (y=390..475) -->
  <!-- ================================================ -->

  <rect x="16" y="390" width="124" height="85" rx="8" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="78" y="438" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#92400E">Milestones</text>

  <rect x="150" y="390" width="710" height="85" fill="#FFFBEB" stroke="#E5E7EB" stroke-width="1" fill-opacity="0.4"/>

  <!-- Milestone diamonds + labels -->
  <rect x="258" y="410" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 264 416)"/>
  <text x="280" y="420" font-size="10" font-weight="500" fill="#92400E">Milestone: [observable outcome]</text>

  <rect x="498" y="410" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 504 416)"/>
  <text x="516" y="420" font-size="10" font-weight="500" fill="#92400E">Milestone: [observable outcome]</text>

  <rect x="728" y="410" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 734 416)"/>
  <text x="746" y="420" font-size="10" font-weight="500" fill="#92400E">Milestone: [observable outcome]</text>

  <!-- Lane annotation -->
  <text x="162" y="462" font-size="10" fill="#6B7280" font-style="italic">Observable checkpoints confirming investments + activities produced behavioral change.</text>

  <!-- ================================================ -->
  <!-- LANE 4: Leading Indicators (y=485..560) -->
  <!-- ================================================ -->

  <rect x="16" y="485" width="124" height="75" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="78" y="518" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#5B21B6">Leading</text>
  <text x="78" y="534" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#5B21B6">Indicators</text>

  <rect x="150" y="485" width="710" height="75" fill="#F5F3FF" stroke="#E5E7EB" stroke-width="1" fill-opacity="0.4"/>

  <!-- Indicator markers with trend arrows -->
  <circle cx="210" cy="516" r="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="210" y="520" text-anchor="middle" font-size="12" fill="#5B21B6">&#8593;</text>
  <text x="228" y="520" font-size="10" fill="#5B21B6">[metric] target: [range]</text>

  <circle cx="420" cy="516" r="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="420" y="520" text-anchor="middle" font-size="12" fill="#5B21B6">&#8594;</text>
  <text x="438" y="520" font-size="10" fill="#5B21B6">[metric] target: [range]</text>

  <circle cx="630" cy="516" r="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="630" y="520" text-anchor="middle" font-size="12" fill="#5B21B6">&#8593;</text>
  <text x="648" y="520" font-size="10" fill="#5B21B6">[metric] target: [range]</text>

  <circle cx="810" cy="516" r="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="810" y="520" text-anchor="middle" font-size="12" fill="#5B21B6">&#8595;</text>

  <!-- Lane annotation -->
  <text x="162" y="550" font-size="10" fill="#6B7280" font-style="italic">Early signal between milestones. If trending down, investigate before the next milestone.</text>

  <!-- ================================================ -->
  <!-- RE-DIAGNOSTIC LOOP (horizontal annotation below lanes) -->
  <!-- ================================================ -->
  <rect x="150" y="568" width="710" height="28" rx="6" fill="#fff" stroke="#D912AE" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="505" y="586" text-anchor="middle" font-size="10" font-weight="500" fill="#D912AE">After Phase 3: Re-Diagnostic &#8594; Roadmap Refresh &#8594; Next Cycle (loop back to Phase 1)</text>
  <!-- Loop arrow -->
  <path d="M 860 582 C 878 582, 878 90, 860 90 L 150 90" fill="none" stroke="#D912AE" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-accent)"/>

  <!-- ================================================ -->
  <!-- LEGEND -->
  <!-- ================================================ -->
  <rect x="16" y="580" width="868" height="52" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="36" y="602" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#151D1A">Legend</text>

  <!-- Investment block -->
  <rect x="96" y="594" width="24" height="14" rx="4" fill="#fff" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="126" y="605" font-size="10" fill="#6B7280">Investment</text>

  <!-- Activity block -->
  <rect x="206" y="594" width="24" height="14" rx="4" fill="#fff" stroke="#34D399" stroke-width="1.5"/>
  <text x="236" y="605" font-size="10" fill="#6B7280">Activity</text>

  <!-- Milestone diamond -->
  <rect x="310" y="594" width="10" height="10" rx="1" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 315 599)"/>
  <text x="328" y="605" font-size="10" fill="#6B7280">Milestone</text>

  <!-- Dependency arrow -->
  <line x1="412" y1="601" x2="440" y2="601" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="450" y="605" font-size="10" fill="#6B7280">Dependency</text>

  <!-- Phase gate -->
  <rect x="540" y="594" width="10" height="10" rx="1" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5" transform="rotate(45 545 599)"/>
  <line x1="558" y1="588" x2="558" y2="614" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="568" y="605" font-size="10" fill="#6B7280">Phase Gate</text>

  <!-- Trend indicators -->
  <text x="660" y="605" font-size="12" fill="#A78BFA">&#8593; &#8594; &#8595;</text>
  <text x="700" y="605" font-size="10" fill="#6B7280">Indicator Trends</text>

  <!-- Accent loop -->
  <line x1="794" y1="601" x2="820" y2="601" stroke="#D912AE" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="828" y="605" font-size="10" fill="#6B7280">Loop</text>

  <!-- Bottom annotation -->
  <text x="450" y="656" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">Phase gates: Verify prerequisites before advancing. These are real decision points, not calendar boundaries.</text>

  <!-- Duarte principle annotation -->
  <rect x="16" y="672" width="868" height="36" rx="8" fill="#F9FAFB" stroke="#D912AE" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="450" y="690" text-anchor="middle" font-size="10" fill="#D912AE" font-weight="500">Re-diagnostic calibrates the next roadmap cycle. Each cycle moves from "what is" (current state) to "what could be" (target zone).</text>
  <text x="450" y="702" text-anchor="middle" font-size="10" fill="#6B7280">The Investments lane drives everything below it. If investments stall, activities, milestones, and indicators will follow.</text>

</svg>